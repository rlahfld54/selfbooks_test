<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>부가가치세화면모음 개발자 주석</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: slim top bar, left menu (부가가치세 and its sub-screens), the selected screen fills the rest. Built screens open live; unbuilt ones are listed as 준비중. */
:root{
  --bg:#12161C; --surface:#181D25; --surface-2:#1E252F; --line:#2B3340; --line-soft:#252D39;
  --fg:#E7EAF0; --fg-2:#B4BCC9; --muted:#8892A2;
  --accent:#D9A441; --accent-fg:#1B1404; --accent-soft:rgba(217,164,65,.13);
  --ok:#5DBB8D; --info:#6DA8E6;
  --f-ui:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --line:#D3D9E2; --line-soft:#E1E6EC;
  --fg:#171E2A; --fg-2:#3A4556; --muted:#677285;
  --accent:#9A6406; --accent-fg:#FFFFFF; --accent-soft:rgba(154,100,6,.10);
  --ok:#1D8A5A; --info:#2A67AE;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--f-ui);display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.bar h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.bar .sub{color:var(--muted);font-size:12px;margin-left:10px}
.ibtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;cursor:pointer;padding:0}
.ibtn:hover{border-color:var(--muted)}
.ibtn:focus-visible,.mi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{flex:1;min-height:0;display:flex}
.side{flex:none;width:248px;border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 10px max(14px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.side h2{margin:2px 8px 10px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.grp{margin:12px 8px 4px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.mi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;color:var(--fg-2)}
.mi:hover{background:var(--surface-2)}
.mi[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:700}
.mi.off{color:var(--muted);cursor:default}
.mi.off:hover{background:none}
.tag{font-size:11px;font-weight:500;padding:0 7px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:18px}
.stage{flex:1;min-width:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.soon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:24px}
.soon b{color:var(--fg);font-size:15px}
[hidden]{display:none!important}
@media (max-width:860px){
  .wrap{flex-direction:column}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;align-items:center}
  .side h2,.grp{display:none}
  .mi{width:auto;white-space:nowrap}
  .bar .sub{display:none}
}

.dock{flex:none;width:320px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.dock.col{width:36px}
.dock.col .dbody,.dock.col .dh span{display:none}
.dh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;color:var(--accent)}
.dock.col .dh{padding:10px 6px;justify-content:center}
.dbody{flex:1;overflow:auto;padding:8px}
.an{display:block;width:100%;text-align:left;border:1px solid var(--line-soft);background:var(--surface-2);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.an:hover{border-color:var(--muted)}
.an.on{border-color:var(--accent);background:var(--accent-soft)}
.an .n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font:700 11px var(--f-num);margin-right:6px}
.an b{font-size:13px}
.an p{margin:6px 0 0;color:var(--fg-2);font-size:12px;line-height:1.55}
.an.miss{opacity:.55}
@media (max-width:860px){.dock{width:auto;max-height:38vh;border-left:0;border-top:1px solid var(--line)}.dock.col{width:auto;max-height:none}}
</style>

<header class="bar">
  <div><h1 style="display:inline">부가가치세화면모음</h1><span class="sub">부가가치세 메뉴의 화면을 한곳에서 봅니다</span></div>
  <label style="margin-left:auto;margin-right:10px;color:var(--muted);font-size:12px;display:inline-flex;align-items:center;gap:6px">사업자구분 <select id="bizType" style="height:30px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:6px;padding:0 8px;font:inherit"><option value="개인">개인</option><option value="법인">법인</option></select></label>
  <button type="button" class="ibtn" id="themeBtn" aria-label="다크/라이트 모드 전환" title="다크/라이트 모드">
    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
  </button>
</header>
<div class="wrap">
  <nav class="side" aria-label="부가가치세 메뉴">
    <h2>부가가치세</h2>
    <div class="grp">부가세신고서</div>
    <button type="button" class="mi" data-id="gen">일반과세자</button>
    <button type="button" class="mi" data-id="sim">간이과세자</button>
    <div class="grp">부속명세</div>
    <button type="button" class="mi" data-id="ije">의제매입세액공제신고서 (개인)</button>
    <button type="button" class="mi" data-id="ijec">의제매입세액공제신고서 (법인)</button>
    <button type="button" class="mi" data-id="rent">부동산임대공급가액명세서</button>
    <button type="button" class="mi off" data-soon="건물등감가상각자산취득명세서"><span>건물등감가상각자산취득명세서</span><span class="tag">준비중</span></button>
    <button type="button" class="mi" data-id="ele">전자세금계산서발급세액공제신고서</button>
    <button type="button" class="mi off" data-soon="공제받지못할매입세액"><span>공제받지못할매입세액</span><span class="tag">준비중</span></button>
    <button type="button" class="mi" data-id="cash">현금매출명세서</button>
    <button type="button" class="mi off" data-soon="부가세수집대사표"><span>부가세수집대사표</span><span class="tag">준비중</span></button>
    <button type="button" class="mi off" data-soon="예상부가세시뮬레이터"><span>예상부가세시뮬레이터</span><span class="tag">준비중</span></button>
    <div class="grp">집계표</div>
    <button type="button" class="mi" data-id="inv">세금계산서합계표</button>
    <button type="button" class="mi" data-id="bill">계산서합계표</button>
    <button type="button" class="mi" data-id="crv">신용카드매출전표등수령명세서</button>
    <button type="button" class="mi" data-id="cis">신용카드매출전표등발행금액집계표</button>

  </nav>
  <main class="stage" id="stage">
    <iframe id="frame" title="부가가치세 화면"></iframe>
    <div class="soon" id="soon" hidden><b id="soonName"></b><span>아직 만들지 않은 화면입니다.</span></div>
  </main>
  <aside class="dock" id="dock" aria-label="개발자 주석">
    <div class="dh"><span id="dTitleH">개발자 주석</span><button type="button" class="ibtn" id="dToggle" aria-label="주석 패널 접기/펼치기">▸</button></div>
    <div class="dbody" id="dbody"></div>
  </aside>
</div>

<script>
const SCREENS={gen:"<title>부가가치세신고서<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap\">\n<style>\n/* Layout: sticky top bar -> filter band (기수, 기간, 신고구분, 조회) -> [신고서 표 | 연결 자료 3단 패널 | 세액정보·작성요령].\n   Dark first, gold accent, monospaced numerals, same system as the other SelfBooks screens; light theme is the override. */\n:root{\n  --bg:#12161C; --surface:#181D25; --surface-2:#1E252F; --line:#2B3340; --line-soft:#252D39;\n  --fg:#E7EAF0; --fg-2:#B4BCC9; --muted:#8892A2;\n  --accent:#D9A441; --accent-fg:#1B1404; --accent-soft:rgba(217,164,65,.13);\n  --in-bg:#12171E; --derived-bg:#1C232D; --off-bg:#0F1318; --off-line:#1B222B;\n  --diff-bg:rgba(109,168,230,.16);\n  --ok:#5DBB8D; --warn:#E58A4B; --bad:#E5706F; --info:#6DA8E6;\n  --ht-bg:#FFFFFF; --ht-fg:#1E3A8A; --ht-line:#C9D3EA;\n  --shadow:0 8px 28px rgba(0,0,0,.45);\n  --f-ui:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;\n  --f-num:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n  color-scheme:dark;\n}\n:root[data-theme=\"light\"]{\n  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --line:#D3D9E2; --line-soft:#E1E6EC;\n  --fg:#171E2A; --fg-2:#3A4556; --muted:#677285;\n  --accent:#9A6406; --accent-fg:#FFFFFF; --accent-soft:rgba(154,100,6,.10);\n  --in-bg:#FFFFFF; --derived-bg:#EEF1F5; --off-bg:#E3E7ED; --off-line:#D6DBE3;\n  --diff-bg:rgba(42,103,174,.12);\n  --ok:#1D8A5A; --warn:#B8561A; --bad:#C23B3B; --info:#2A67AE;\n  --shadow:0 8px 28px rgba(20,30,50,.18);\n  color-scheme:light;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--fg);font:13px/1.5 var(--f-ui);padding-bottom:48px;-webkit-text-size-adjust:100%}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}\nbutton,input,select{font:inherit;color:inherit}\n.inner{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\n\n/* top bar */\n.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}\n.topbar .inner{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:12px}\n.title{display:flex;align-items:center;gap:12px;min-width:0}\n.title h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}\n.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:500;border:1px solid var(--line);color:var(--fg-2);background:var(--surface)}\n.chip.on{color:var(--info);border-color:var(--info)}\n.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}\n.group+.group{padding-left:10px;border-left:1px solid var(--line)}\n.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:6px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}\n.btn:hover{border-color:var(--muted)}\n.btn:focus-visible,.eb:focus-visible,.tab:focus-visible,.cell:focus-visible,.txt:focus-visible,summary:focus-visible,.ftable tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.btn svg{flex:none}\n.btn.ico{width:32px;padding:0;justify-content:center}\n.btn.edit{color:var(--info);border-color:var(--info);background:transparent}\n.btn.edit[aria-pressed=\"true\"]{background:var(--info);color:var(--bg)}\n.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}\n.btn.ht{background:var(--ht-bg);color:var(--ht-fg);border-color:var(--ht-line);font-weight:700}\n\n/* filter band */\n.ctx{border-bottom:1px solid var(--line-soft)}\n.ctx .inner{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;padding-block:12px}\n.co{display:flex;align-items:center;gap:10px}\n.co .code{font-family:var(--f-num);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 6px}\n.co strong{font-size:15px}\n.flt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.flt label.l{font-size:12px;color:var(--muted)}\n.seg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}\n.seg label{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--fg-2)}\n.seg label:has(input:checked){border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}\n.seg input,.dlg label.ck input{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:0;border:1.5px solid var(--muted);border-radius:50%;background:transparent;display:inline-grid;place-content:center;cursor:pointer}\n.seg input::before,.dlg label.ck input::before{content:\"\";width:8px;height:8px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .12s}\n.seg input:checked,.dlg label.ck input:checked{border-color:var(--accent)}\n.seg input:checked::before,.dlg label.ck input:checked::before{transform:scale(1)}\n.seg input:disabled,.dlg label.ck input:disabled{opacity:.5;cursor:default}\n.seg input:focus-visible,.dlg label.ck input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.due{margin-left:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px}\n.due b{color:var(--fg);font-family:var(--f-num);font-weight:500}\n.due .fin b{color:var(--accent);font-weight:700;font-size:14px}\n\nmain .inner{padding-top:16px}\n.nav{flex-basis:100%;display:flex;align-items:center;gap:8px ><\/select>\n    <\/div>\n    <button type=\"button\" class=\"btn\" id=\"qBtn\">조회<\/button>\n    <div class=\"due\">\n      <span id=\"dueBox\">신고·납부기한 <b id=\"dueDate\">2026.07.27<\/b><\/span><span class=\"subhint\" id=\"subHint\" hidden>제출용 조회 · 기수와 무관하게 기간을 직접 지정 (저장·마감 불가)<\/span>\n      <span class=\"fin\"><span>마감여부<\/span> <b id=\"statTxt\">미마감<\/b><\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<main>\n  <div class=\"inner\">\n    <div class=\"g3\">\n      <div class=\"card\">\n        <div id=\"sumBody\"><\/div>\n        <p class=\"hint\" style=\"margin:0;padding:12px 16px\">※ 국세청 자료검증 및 사이트비교에서 데이터를 확인 후 마감하시기 바랍니다.<\/p>\n      <\/div>\n\n      <section class=\"card\">\n        <div class=\"card-h\"><h2 id=\"dTitle\"><\/h2><button type=\"button\" class=\"btn\" id=\"addRow\">+ 행 추가<\/button><\/div>\n        <div class=\"dwrap\" id=\"dWrap\"><\/div>\n      <\/section>\n\n      <aside class=\"aside\" aria-label=\"합계 정보\">\n        <div class=\"card\">\n          <div class=\"card-h\"><h2>신고일자<\/h2><\/div>\n          <div class=\"card-b\"><input class=\"txt\" type=\"date\" id=\"rptDate\" value=\"2026-07-27\" data-edit><\/div>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-h\"><h2>매출 공급가액 합계<\/h2><\/div>\n          <div class=\"card-b\" id=\"asS\"><\/div>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-h\"><h2>매입 공급가액 합계<\/h2><\/div>\n          <div class=\"card-b\" id=\"asP\"><\/div>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-h\"><h2>참고사항<\/h2><\/div>\n          <div class=\"card-b\"><p class=\"guide\">전자 세금계산서는 홈택스 수집자료에서 자동으로 반영되며 수정할 수 없습니다. 제출용 자료조회는 신고서 마감기간과 무관하게 기간을 직접 지정해 조회합니다. 전자 외(종이) 세금계산서는 목록에서 행을 추가해 직접 입력합니다. 신고년월을 따로 입력하지 않은 전표는 전표 일자 기준으로 반영됩니다.<\/p><\/div>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/main>\n\n<div class=\"scrim\" id=\"subModal\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"subTitle\">\n  <div class=\"dlg\" style=\"width:min(460px,100%)\">\n    <h2 id=\"subTitle\" style=\"display:flex;justify-content:space-between;align-items:center\">제출용 자료조회<button type=\"button\" class=\"eb\" id=\"subX\" aria-label=\"닫기\">✕<\/button><\/h2>\n    <div class=\"b\">\n      <p style=\"margin:0 0 12px;font-weight:700;color:var(--fg-2);font-size:13px;text-align:center\">제출용 조회기간을 입력하신후, 조회 또는 인쇄버튼을 클릭하세요.<\/p>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:8px\"><input class=\"txt\" type=\"month\" id=\"sbFrom\" aria-label=\"시작월\" style=\"width:150px\"><span aria-hidden=\"true\">~<\/span><input class=\"txt\" type=\"month\" id=\"sbTo\" aria-label=\"종료월\" style=\"width:150px\"><\/div>\n      <div style=\"margin-top:14px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--fg-2)\">[참고사항]<br>마감된 기간과 관계없이 데이터 조회 및 인쇄가 가능합니다. 단, 제출용 데이터 조회 화면에서는 데이터삭제, 추가입력, 마감이 불가능합니다.<\/div>\n    <\/div>\n    <div class=\"ft\"><button type=\"button\" class=\"btn\" id=\"subCancel\">취소(esc)<\/button><button type=\"button\" class=\"btn primary\" id=\"subGo\">조회<\/button><button type=\"button\" class=\"btn\" id=\"subPrint\">인쇄<\/button><\/div>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n\n<script>\nconst CFG={\"doc\": \"세금계산서\", \"tax\": true, \"startK\": \"p\", \"sNames\": [\"가온상사\", \"나래푸드\", \"다온케이터링\", \"라온상회\", \"마루식당\", \"바른유통\", \"새봄카페\", \"아람상사\"], \"pNames\": [\"한솔식자재\", \"대성유통\", \"푸른닭고기\", \"제일포장\", \"우리가스\", \"늘푸른기름\", \"알찬소스\", \"동방주방기기\", \"청정수산\", \"햇살농산\", \"미래물류\", \"새롬위생\", \"나눔인쇄\", \"하늘간판\"], \"sH1\": {\"total\": 3200000, \"R\": 16}, \"pH1\": {\"total\": 62500000, \"R\": 33}, \"sH2\": {\"total\": 2800000, \"R\": 14}, \"pH2\": {\"total\": 58000000, \"R\": 30}, \"loadMsg\": \"홈택스 수집 세금계산서를 불러왔습니다\", \"mis\": {\"p\": {\"s\": 4300000, \"n\": 1}}};\nconst $=(s,r=document)=>r.querySelector(s);\nconst $$=(s,r=document)=>Array.from(r.querySelectorAll(s));\nconst fmt=n=>(n<0?'-':'')+Math.abs(Math.trunc(n)).toLocaleString('en-US');\nconst parse=s=>{const d=String(s).replace(/[^0-9]/g,'');return d?parseInt(d,10):0};\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/\"/g,'&quot;');\nconst dot=ym=>ym.replace('-','.');\n\n/* ---------- sample data: one record = one invoice, dated by month ---------- */\nfunction parts(total,n,seed){\n  if(n<=0)return [];\n  const w=[];let ws=0;for(let i=0;i<n;i++){const x=1+((i*7+seed)%5)/8;w.push(x);ws+=x}\n  const out=[];let acc=0;\n  for(let i=0;i<n-1;i++){const v=Math.round(total*w[i]/ws/1000)*1000;out.push(v);acc+=v}\n  out.push(total-acc);return out;\n}\nconst reg=i=>String(100+(i*37)%800)+'-'+String(10+(i*13)%80)+'-'+String(10000+(i*7919)%89999);\nconst REPS=['김민수','이서연','박지훈','최유진','정하늘','강도윤','조은채','윤재호','임수아','한지민','오세훈','서가은','권태양','문해린'];\nconst H1=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];\nconst H2=['2025-07','2025-08','2025-09','2025-10','2025-11','2025-12'];\nconst PART={};\nconst EREC={s:[],p:[]};\n['s','p'].forEach((k,ki)=>{\n  const names=CFG[k+'Names'];\n  PART[k]=names.map((n,i)=>({name:n,reg:reg(i*3+ki*3+2),rep:REPS[(i+ki*3)%REPS.length]}));\n  [['H1',H1],['H2',H2]].forEach(([key,months],hi)=>{\n    const d=CFG[k+key];if(!d||!d.R)return;\n    parts(d.total,d.R,ki*3+hi+2).forEach((v,r)=>{\n      EREC[k].push({p:r%names.length,ym:months[(r*5+(r>>1))%months.length],cnt:1,sup:v,tax:CFG.tax?Math.floor(v/10):0});\n    });\n  });\n});\nconst DATA={s:{xb:[],xr:[]},p:{xb:[],xr:[]}};   /* 전자 외: entered by hand */\nlet cur={k:CFG.startK,t:'e',id:'b'};\nlet mode='file',closed=false;\nlet RANGE={from:'2026-01',to:'2026-06'};\nconst inR=ym=>ym>=RANGE.from&&ym<=RANGE.to;\nconst KEY=c=>c.t+c.id;\n\nfunction view(k,t,id){\n  if(t==='e'){\n    if(id==='r')return [];\n    const m=new Map();\n    EREC[k].filter(r=>inR(r.ym)).forEach(r=>{\n      const o=m.get(r.p)||{name:PART[k][r.p].name,reg:PART[k][r.p].reg,rep:PART[k][r.p].rep,liq:'',unit:'부',cnt:0,sup:0,tax:0};\n      o.cnt+=r.cnt;o.sup+=r.sup;o.tax+=r.tax;m.set(r.p,o);\n    });\n    return Array.from(m.entries()).sort((a,b)=>a[0]-b[0]).map(e=>e[1]);\n  }\n  const l=DATA[k][t+id];\n  return mode==='sub'?l.filter(r=>inR(r.ym)):l;\n}\nconst sum=l=>l.reduce((o,r)=>({c:o.c+1,n:o.n+r.cnt,s:o.s+r.sup,t:o.t+r.tax}),{c:0,n:0,s:0,t:0});\nconst add=(a,b)=>({c:a.c+b.c,n:a.n+b.n,s:a.s+b.s,t:a.t+b.t});\nconst sm=(k,t,id)=>sum(view(k,t,id));\nconst smT=(k,t)=>add(sm(k,t,'b'),sm(k,t,'r'));\n\n/* ---------- summary tables ---------- */\nconst NC=CFG.tax?6:5;\nfunction vcells(v){return '<td class=\"r\">'+fmt(v.c)+'<\/td><td class=\"r\">'+fmt(v.n)+'<\/td><td class=\"r\">'+fmt(v.s)+'<\/td>'+(CFG.tax?'<td class=\"r\">'+fmt(v.t)+'<\/td>':'')}\nfunction srow(k,t,id,label,first,T){\n  const sel=cur.k===k&&cur.t===t&&cur.id===id;\n  return '<tr data-k=\"'+k+'\" data-t=\"'+t+'\" data-id=\"'+id+'\" class=\"pick-row'+(sel?' sel':'')+'\" tabindex=\"0\">'+(first?'<th class=\"g1\" rowspan=\"3\" scope=\"rowgroup\">'+T+'<\/th>':'')+'<td class=\"ct\">'+label+'<\/td>'+vcells(sm(k,t,id))+'<\/tr>';\n}\nconst ssub=(k,t)=>'<tr class=\"sub\"><td class=\"ct\">소계<\/td>'+vcells(smT(k,t))+'<\/tr>';\nfunction stable(k){\n  const nm=k==='s'?'매출':'매입';\n  const tot=add(smT(k,'e'),smT(k,'x'));\n  return '<div class=\"sec '+(k==='s'?'sale':'buy')+'\"><h3>'+nm+CFG.doc+'<\/h3><\/div>'\n   +'<div class=\"swrap\"><table class=\"stbl\"><thead><tr><th>유형<\/th><th>구분<\/th><th>'+nm+'처<\/th><th>매수<\/th><th>공급가액<\/th>'+(CFG.tax?'<th>부가세<\/th>':'')+'<\/tr><\/thead><tbody>'\n   +srow(k,'e','b','사업자',1,'전자')+srow(k,'e','r','주민번호',0)+ssub(k,'e')\n   +srow(k,'x','b','사업자',1,'전자 외')+srow(k,'x','r','주민번호',0)+ssub(k,'x')\n   +'<tr class=\"total\"><td colspan=\"2\" class=\"ct\">합계<\/td>'+vcells(tot)+'<\/tr>'\n   +'<\/tbody><\/table><\/div>';\n}\nlet RECON=null;\nconst nowStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};\nfunction reconRows(){\n  const out=[];\n  ['s','p'].forEach(k=>{\n    const e=smT(k,'e'),h=RECON.ht[k];\n    const items=[['총 매수',e.n,h.n],['총 합계금액',e.s+e.t,h.s+h.t],['총 공급가액',e.s,h.s]];\n    if(CFG.tax)items.push(['총 세액',e.t,h.t]);\n    items.forEach((it,i)=>out.push({k,first:i===0,n:items.length,nm:k==='s'?'매출':'매입',lb:it[0],a:it[1],b:it[2]}));\n  });\n  return out;\n}\nfunction reconHtml(){\n  const hd='<div class=\"sec recon\"><h3>홈택스 대사 <span class=\"rsub\">전자'+CFG.doc+' · 홈택스 세무대리·납세관리 목록조회 기준<\/span><\/h3><\/div>';\n  if(!RECON)return hd+'<p class=\"rc-empty\">[홈택스 자료조회]를 누르면 홈택스 전자'+CFG.doc+' 목록조회 합계와 프로그램에 수집된 전자분 합계를 대사합니다.<\/p>';\n  const rows=reconRows(),bad=rows.filter(r=>r.a!==r.b).length;\n  const stale=RECON.from!==RANGE.from||RECON.to!==RANGE.to;\n  let h=hd+'<div class=\"rc-meta\"><span>대사일자 <b>'+RECON.at+'<\/b><\/span><span>대사기간 <b>'+dot(RECON.from)+' ~ '+dot(RECON.to)+'<\/b><\/span><span>대사결과 <b class=\"'+(bad?'rc-bad':'rc-ok')+'\">'+(bad?'불일치 '+bad+'건':'전체 일치')+'<\/b><\/span>'+(stale?'<span class=\"rc-bad\">조회기간이 달라졌습니다. 다시 대사하세요.<\/span>':'')+'<\/div>'\n   +'<div class=\"swrap\"><table class=\"stbl rtbl\"><thead><tr><th>구분<\/th><th>항목<\/th><th>프로그램 (전자)<\/th><th>홈택스<\/th><th>차이<\/th><th>결과<\/th><\/tr><\/thead><tbody>';\n  rows.forEach(r=>{\n    const d=r.a-r.b,ok=d===0;\n    h+='<tr>'+(r.first?'<th class=\"g1\" rowspan=\"'+r.n+'\" scope=\"rowgroup\">'+r.nm+'<\/th>':'')+'<td class=\"ct\">'+r.lb+'<\/td><td class=\"r\">'+fmt(r.a)+'<\/td><td class=\"r\">'+fmt(r.b)+'<\/td><td class=\"r'+(ok?'':' rc-bad')+'\">'+fmt(d)+'<\/td><td class=\"ct\"><span class=\"rc-b '+(ok?'rc-ok':'rc-bad')+'\">'+(ok?'일치':'불일치')+'<\/span><\/td><\/tr>';\n  });\n  h+='<\/tbody><\/table><\/div>';\n  if(bad)h+='<p class=\"rc-note\">※ 홈택스 목록조회에는 있으나 프로그램에 수집되지 않은 전자'+CFG.doc+'가 있습니다. [불러오기]로 다시 수집한 뒤 [홈택스 자료조회]로 재대사하세요.<\/p>';\n  return h;\n}\nfunction renderSummary(){$('#sumBody').innerHTML=stable('s')+stable('p')+reconHtml()}\n/* 홈택스 목록조회 합계(견본): 프로그램 전자분과 같게 두되 CFG.mis 가 있으면 그만큼 다르게 */\nfunction runRecon(quiet){\n  const ht={};\n  ['s','p'].forEach(k=>{const e=smT(k,'e'),m=(CFG.mis&&CFG.mis[k])||null;ht[k]={n:e.n+(m?m.n:0),s:e.s+(m?m.s:0),t:e.t+(CFG.tax&&m?Math.floor(m.s/10):0)}});\n  RECON={at:nowStr(),from:RANGE.from,to:RANGE.to,ht};\n  refresh(false);\n  if(quiet)return;\n  const bad=reconRows().filter(r=>r.a!==r.b).length;\n  toast(bad?'홈택스와 대사했습니다 · 불일치 '+bad+'건':'홈택스와 대사했습니다 · 전체 일치',2800);\n}\n\n/* ---------- detail list ---------- */\nfunction cols(t){\n  const c=[{f:'name',l:'거래처명',k:'txt'},{f:'reg',l:cur.id==='b'?'등록번호':'주민등록번호',k:'txt'},{f:'cnt',l:'매수',k:'num'},{f:'sup',l:'공급가액',k:'num'}];\n  if(CFG.tax)c.push({f:'tax',l:'부가세',k:'num'});\n  c.push({f:'rep',l:'대표자명',k:'txt'});\n  if(CFG.tax){c.push({f:'liq',l:'주류업종',k:'txt'});c.push({f:'unit',l:'단위신고',k:'sel'})}\n  if(t==='x')c.push({f:'ym',l:'작성월',k:'month'});\n  return c;\n}\nconst titleOf=c=>'('+(c.k==='p'?'매입':'매출')+') '+(c.t==='e'?'전자':'전자 외')+' '+CFG.doc+' · '+(c.id==='b'?'사업자':'주민번호');\nfunction detailFoot(){\n  const cs=cols(cur.t),v=sm(cur.k,cur.t,cur.id);\n  const total=cs.length+1+(cur.t==='x'?1:0);\n  const nn=CFG.tax?3:2;\n  const rest=total-3-nn;\n  const num=x=>{let h='<td class=\"r\">'+fmt(x.n)+'<\/td><td class=\"r\">'+fmt(x.s)+'<\/td>';if(CFG.tax)h+='<td class=\"r\">'+fmt(x.t)+'<\/td>';return h};\n  const e=smT(cur.k,'e');\n  $('#dFoot').innerHTML='<tr><td colspan=\"3\" class=\"ct\">합계 ('+fmt(v.c)+'건)<\/td>'+num(v)+'<td colspan=\"'+rest+'\"><\/td><\/tr>'\n   +'<tr class=\"f2\"><td colspan=\"3\" class=\"ct\">전자신고 마감합계<\/td>'+num(e)+'<td colspan=\"'+rest+'\" class=\"hint\">'+dot(RANGE.from)+' ~ '+dot(RANGE.to)+'<\/td><\/tr>';\n}\nfunction renderDetail(){\n  const list=view(cur.k,cur.t,cur.id),edit=cur.t==='x'&&mode==='file'&&!closed;\n  const cs=cols(cur.t);\n  $('#dTitle').textContent=titleOf(cur);\n  $('#addRow').hidden=!(cur.t==='x'&&mode==='file');\n  $('#addRow').disabled=closed;\n  const ncol=cs.length+1+(cur.t==='x'?1:0);\n  const th='<tr><th style=\"width:44px\">No<\/th>'+cs.map(c=>'<th>'+c.l+'<\/th>').join('')+(cur.t==='x'?'<th style=\"width:40px\"><\/th>':'')+'<\/tr>';\n  let body;\n  if(!list.length){\n    body='<tr><td colspan=\"'+ncol+'\"><div class=\"empty\"><svg viewBox=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h4\"/><\/svg><span>'+(cur.t==='x'&&mode==='file'?'입력된 내용이 없습니다. [+ 행 추가]로 입력하세요.':'데이터가 없습니다.')+'<\/span><\/div><\/td><\/tr>';\n  }else body=list.map((r,i)=>{\n    let h='<tr data-i=\"'+i+'\"><td class=\"ct n\">'+(i+1)+'<\/td>';\n    cs.forEach(c=>{\n      const val=r[c.f];\n      if(!edit){\n        if(c.k==='num')h+='<td class=\"r\">'+fmt(val)+'<\/td>';\n        else if(c.f==='reg')h+='<td class=\"ct num\">'+esc(val)+'<\/td>';\n        else if(c.f==='unit'||c.f==='ym')h+='<td class=\"ct\">'+esc(c.f==='ym'?dot(val):val)+'<\/td>';\n        else h+='<td>'+esc(val)+'<\/td>';\n      }else if(c.k==='num')h+='<td><input class=\"cell in\" data-f=\"'+c.f+'\" inputmode=\"numeric\" value=\"'+fmt(val)+'\" aria-label=\"'+c.l+'\"><\/td>';\n      else if(c.k==='sel')h+='<td><select class=\"txt\" data-f=\"unit\" aria-label=\"'+c.l+'\"><option'+(val==='여'?' selected':'')+'>여<\/option><option'+(val==='부'?' selected':'')+'>부<\/option><\/select><\/td>';\n      else if(c.k==='month')h+='<td><input class=\"txt\" type=\"month\" data-f=\"ym\" value=\"'+esc(val)+'\" aria-label=\"'+c.l+'\"><\/td>';\n      else h+='<td><input class=\"txt'+(c.f==='reg'?' num':'')+'\" data-f=\"'+c.f+'\" value=\"'+esc(val)+'\" aria-label=\"'+c.l+'\"><\/td>';\n    });\n    if(cur.t==='x')h+=edit?'<td class=\"ct\"><button type=\"button\" class=\"eb\" data-del=\"'+i+'\" aria-label=\"행 삭제\" title=\"행 삭제\"><svg viewBox=\"0 0 16 16\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M3.5 3.5l9 9M12.5 3.5l-9 9\"/><\/svg><\/button><\/td>':'<td><\/td>';\n    re ass=\"dlg\" style=\"width:min(460px,100%)\">\n    <h2 id=\"subTitle\" style=\"display:flex;justify-content:space-between;align-items:center\">제출용 자료조회<button type=\"button\" class=\"eb\" id=\"subX\" aria-label=\"닫기\">✕<\/button><\/h2>\n    <div class=\"b\">\n      <p style=\"margin:0 0 12px;font-weight:700;color:var(--fg-2);font-size:13px;text-align:center\">제출용 조회기간을 입력하신후, 조회 또는 인쇄버튼을 클릭하세요.<\/p>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:8px\"><input class=\"txt\" type=\"month\" id=\"sbFrom\" aria-label=\"시작월\" style=\"width:150px\"><span aria-hidden=\"true\">~<\/span><input class=\"txt\" type=\"month\" id=\"sbTo\" aria-label=\"종료월\" style=\"width:150px\"><\/div>\n      <div style=\"margin-top:14px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:var(--fg-2)\">[참고사항]<br>마감된 기간과 관계없이 데이터 조회 및 인쇄가 가능합니다. 단, 제출용 데이터 조회 화면에서는 데이터삭제, 추가입력, 마감이 불가능합니다.<\/div>\n    <\/div>\n    <div class=\"ft\"><button type=\"button\" class=\"btn\" id=\"subCancel\">취소(esc)<\/button><button type=\"button\" class=\"btn primary\" id=\"subGo\">조회<\/button><button type=\"button\" class=\"btn\" id=\"subPrint\">인쇄<\/button><\/div>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n\n<script>\nconst CFG={\"doc\": \"계산서\", \"tax\": false, \"startK\": \"p\", \"sNames\": [\"(매출 없음)\"], \"pNames\": [\"엔에이치농협캐피탈 주식회사\", \"에이스하이엔드타워 별내지식산업센터\"], \"sH1\": {\"total\": 0, \"R\": 0}, \"pH1\": {\"total\": 8829412, \"R\": 9}, \"sH2\": {\"total\": 0, \"R\": 0}, \"pH2\": {\"total\": 7100000, \"R\": 7}, \"loadMsg\": \"홈택스 수집 계산서를 불러왔습니다\"};\nconst $=(s,r=document)=>r.querySelector(s);\nconst $$=(s,r=document)=>Array.from(r.querySelectorAll(s));\nconst fmt=n=>(n<0?'-':'')+Math.abs(Math.trunc(n)).toLocaleString('en-US');\nconst parse=s=>{const d=String(s).replace(/[^0-9]/g,'');return d?parseInt(d,10):0};\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/\"/g,'&quot;');\nconst dot=ym=>ym.replace('-','.');\n\n/* ---------- sample data: one record = one invoice, dated by month ---------- */\nfunction parts(total,n,seed){\n  if(n<=0)return [];\n  const w=[];let ws=0;for(let i=0;i<n;i++){const x=1+((i*7+seed)%5)/8;w.push(x);ws+=x}\n  const out=[];let acc=0;\n  for(let i=0;i<n-1;i++){const v=Math.round(total*w[i]/ws/1000)*1000;out.push(v);acc+=v}\n  out.push(total-acc);return out;\n}\nconst reg=i=>String(100+(i*37)%800)+'-'+String(10+(i*13)%80)+'-'+String(10000+(i*7919)%89999);\nconst REPS=['김민수','이서연','박지훈','최유진','정하늘','강도윤','조은채','윤재호','임수아','한지민','오세훈','서가은','권태양','문해린'];\nconst H1=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];\nconst H2=['2025-07','2025-08','2025-09','2025-10','2025-11','2025-12'];\nconst PART={};\nconst EREC={s:[],p:[]};\n['s','p'].forEach((k,ki)=>{\n  const names=CFG[k+'Names'];\n  PART[k]=names.map((n,i)=>({name:n,reg:reg(i*3+ki*3+2),rep:REPS[(i+ki*3)%REPS.length]}));\n  [['H1',H1],['H2',H2]].forEach(([key,months],hi)=>{\n    const d=CFG[k+key];if(!d||!d.R)return;\n    parts(d.total,d.R,ki*3+hi+2).forEach((v,r)=>{\n      EREC[k].push({p:r%names.length,ym:months[(r*5+(r>>1))%months.length],cnt:1,sup:v,tax:CFG.tax?Math.floor(v/10):0});\n    });\n  });\n});\nconst DATA={s:{xb:[],xr:[]},p:{xb:[],xr:[]}};   /* 전자 외: entered by hand */\nlet cur={k:CFG.startK,t:'e',id:'b'};\nlet mode='file',closed=false;\nlet RANGE={from:'2026-01',to:'2026-06'};\nconst inR=ym=>ym>=RANGE.from&&ym<=RANGE.to;\nconst KEY=c=>c.t+c.id;\n\nfunction view(k,t,id){\n  if(t==='e'){\n    if(id==='r')return [];\n    const m=new Map();\n    EREC[k].filter(r=>inR(r.ym)).forEach(r=>{\n      const o=m.get(r.p)||{name:PART[k][r.p].name,reg:PART[k][r.p].reg,rep:PART[k][r.p].rep,liq:'',unit:'부',cnt:0,sup:0,tax:0};\n      o.cnt+=r.cnt;o.sup+=r.sup;o.tax+=r.tax;m.set(r.p,o);\n    });\n    return Array.from(m.entries()).sort((a,b)=>a[0]-b[0]).map(e=>e[1]);\n  }\n  const l=DATA[k][t+id];\n  return mode==='sub'?l.filter(r=>inR(r.ym)):l;\n}\nconst sum=l=>l.reduce((o,r)=>({c:o.c+1,n:o.n+r.cnt,s:o.s+r.sup,t:o.t+r.tax}),{c:0,n:0,s:0,t:0});\nconst add=(a,b)=>({c:a.c+b.c,n:a.n+b.n,s:a.s+b.s,t:a.t+b.t});\nconst sm=(k,t,id)=>sum(view(k,t,id));\nconst smT=(k,t)=>add(sm(k,t,'b'),sm(k,t,'r'));\n\n/* ---------- summary tables ---------- */\nconst NC=CFG.tax?6:5;\nfunction vcells(v){return '<td class=\"r\">'+fmt(v.c)+'<\/td><td class=\"r\">'+fmt(v.n)+'<\/td><td class=\"r\">'+fmt(v.s)+'<\/td>'+(CFG.tax?'<td class=\"r\">'+fmt(v.t)+'<\/td>':'')}\nfunction srow(k,t,id,label,first,T){\n  const sel=cur.k===k&&cur.t===t&&cur.id===id;\n  return '<tr data-k=\"'+k+'\" data-t=\"'+t+'\" data-id=\"'+id+'\" class=\"pick-row'+(sel?' sel':'')+'\" tabindex=\"0\">'+(first?'<th class=\"g1\" rowspan=\"3\" scope=\"rowgroup\">'+T+'<\/th>':'')+'<td class=\"ct\">'+label+'<\/td>'+vcells(sm(k,t,id))+'<\/tr>';\n}\nconst ssub=(k,t)=>'<tr class=\"sub\"><td class=\"ct\">소계<\/td>'+vcells(smT(k,t))+'<\/tr>';\nfunction stable(k){\n  const nm=k==='s'?'매출':'매입';\n  const tot=add(smT(k,'e'),smT(k,'x'));\n  return '<div class=\"sec '+(k==='s'?'sale':'buy')+'\"><h3>'+nm+CFG.doc+'<\/h3><\/div>'\n   +'<div class=\"swrap\"><table class=\"stbl\"><thead><tr><th>유형<\/th><th>구분<\/th><th>'+nm+'처<\/th><th>매수<\/th><th>공급가액<\/th>'+(CFG.tax?'<th>부가세<\/th>':'')+'<\/tr><\/thead><tbody>'\n   +srow(k,'e','b','사업자',1,'전자')+srow(k,'e','r','주민번호',0)+ssub(k,'e')\n   +srow(k,'x','b','사업자',1,'전자 외')+srow(k,'x','r','주민번호',0)+ssub(k,'x')\n   +'<tr class=\"total\"><td colspan=\"2\" class=\"ct\">합계<\/td>'+vcells(tot)+'<\/tr>'\n   +'<\/tbody><\/table><\/div>';\n}\nlet RECON=null;\nconst nowStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};\nfunction reconRows(){\n  const out=[];\n  ['s','p'].forEach(k=>{\n    const e=smT(k,'e'),h=RECON.ht[k];\n    const items=[['총 매수',e.n,h.n],['총 합계금액',e.s+e.t,h.s+h.t],['총 공급가액',e.s,h.s]];\n    if(CFG.tax)items.push(['총 세액',e.t,h.t]);\n    items.forEach((it,i)=>out.push({k,first:i===0,n:items.length,nm:k==='s'?'매출':'매입',lb:it[0],a:it[1],b:it[2]}));\n  });\n  return out;\n}\nfunction reconHtml(){\n  const hd='<div class=\"sec recon\"><h3>홈택스 대사 <span class=\"rsub\">전자'+CFG.doc+' · 홈택스 세무대리·납세관리 목록조회 기준<\/span><\/h3><\/div>';\n  if(!RECON)return hd+'<p class=\"rc-empty\">[홈택스 자료조회]를 누르면 홈택스 전자'+CFG.doc+' 목록조회 합계와 프로그램에 수집된 전자분 합계를 대사합니다.<\/p>';\n  const rows=reconRows(),bad=rows.filter(r=>r.a!==r.b).length;\n  const stale=RECON.from!==RANGE.from||RECON.to!==RANGE.to;\n  let h=hd+'<div class=\"rc-meta\"><span>대사일자 <b>'+RECON.at+'<\/b><\/span><span>대사기간 <b>'+dot(RECON.from)+' ~ '+dot(RECON.to)+'<\/b><\/span><span>대사결과 <b class=\"'+(bad?'rc-bad':'rc-ok')+'\">'+(bad?'불일치 '+bad+'건':'전체 일치')+'<\/b><\/span>'+(stale?'<span class=\"rc-bad\">조회기간이 달라졌습니다. 다시 대사하세요.<\/span>':'')+'<\/div>'\n   +'<div class=\"swrap\"><table class=\"stbl rtbl\"><thead><tr><th>구분<\/th><th>항목<\/th><th>프로그램 (전자)<\/th><th>홈택스<\/th><th>차이<\/th><th>결과<\/th><\/tr><\/thead><tbody>';\n  rows.forEach(r=>{\n    const d=r.a-r.b,ok=d===0;\n    h+='<tr>'+(r.first?'<th class=\"g1\" rowspan=\"'+r.n+'\" scope=\"rowgroup\">'+r.nm+'<\/th>':'')+'<td class=\"ct\">'+r.lb+'<\/td><td class=\"r\">'+fmt(r.a)+'<\/td><td class=\"r\">'+fmt(r.b)+'<\/td><td class=\"r'+(ok?'':' rc-bad')+'\">'+fmt(d)+'<\/td><td class=\"ct\"><span class=\"rc-b '+(ok?'rc-ok':'rc-bad')+'\">'+(ok?'일치':'불일치')+'<\/span><\/td><\/tr>';\n  });\n  h+='<\/tbody><\/table><\/div>';\n  if(bad)h+='<p class=\"rc-note\">※ 홈택스 목록조회에는 있으나 프로그램에 수집되지 않은 전자'+CFG.doc+'가 있습니다. [불러오기]로 다시 수집한 뒤 [홈택스 자료조회]로 재대사하세요.<\/p>';\n  return h;\n}\nfunction renderSummary(){$('#sumBody').innerHTML=stable('s')+stable('p')+reconHtml()}\n/* 홈택스 목록조회 합계(견본): 프로그램 전자분과 같게 두되 CFG.mis 가 있으면 그만큼 다르게 */\nfunction runRecon(quiet){\n  const ht={};\n  ['s','p'].forEach(k=>{const e=smT(k,'e'),m=(CFG.mis&&CFG.mis[k])||null;ht[k]={n:e.n+(m?m.n:0),s:e.s+(m?m.s:0),t:e.t+(CFG.tax&&m?Math.floor(m.s/10):0)}});\n  RECON={at:nowStr(),from:RANGE.from,to:RANGE.to,ht};\n  refresh(false);\n  if(quiet)return;\n  const bad=reconRows().filter(r=>r.a!==r.b).length;\n  toast(bad?'홈택스와 대사했습니다 · 불일치 '+bad+'건':'홈택스와 대사했습니다 · 전체 일치',2800);\n}\n\n/* ---------- detail list ---------- */\nfunction cols(t){\n  const c=[{f:'name',l:'거래처명',k:'txt'},{f:'reg',l:cur.id==='b'?'등록번호':'주민등록번호',k:'txt'},{f:'cnt',l:'매수',k:'num'},{f:'sup',l:'공급가액',k:'num'}];\n  if(CFG.tax)c.push({f:'tax',l:'부가세',k:'num'});\n  c.push({f:'rep',l:'대표자명',k:'txt'});\n  if(CFG.tax){c.push({f:'liq',l:'주류업종',k:'txt'});c.push({f:'unit',l:'단위신고',k:'sel'})}\n  if(t==='x')c.push({f:'ym',l:'작성월',k:'month'});\n  return c;\n}\nconst titleOf=c=>'('+(c.k==='p'?'매입':'매출')+') '+(c.t==='e'?'전자':'전자 외')+' '+CFG.doc+' · '+(c.id==='b'?'사업자':'주민번호');\nfunction detailFoot(){\n  const cs=cols(cur.t),v=sm(cur.k,cur.t,cur.id);\n  const total=cs.length+1+(cur.t==='x'?1:0);\n  const nn=CFG.tax?3:2;\n  const rest=total-3-nn;\n  const num=x=>{let h='<td class=\"r\">'+fmt(x.n)+'<\/td><td class=\"r\">'+fmt(x.s)+'<\/td>';if(CFG.tax)h+='<td class=\"r\">'+fmt(x.t)+'<\/td>';return h};\n  const e=smT(cur.k,'e');\n  $('#dFoot').innerHTML='<tr><td colspan=\"3\" class=\"ct\">합계 ('+fmt(v.c)+'건)<\/td>'+num(v)+'<td colspan=\"'+rest+'\"><\/td><\/tr>'\n   +'<tr class=\"f2\"><td colspan=\"3\" class=\"ct\">전자신고 마감합계<\/td>'+num(e)+'<td colspan=\"'+rest+'\" class=\"hint\">'+dot(RANGE.from)+' ~ '+dot(RANGE.to)+'<\/td><\/tr>';\n}\nfunction renderDetail(){\n  const list=view(cur.k,cur.t,cur.id),edit=cur.t==='x'&&mode==='file'&&!closed;\n  const cs=cols(cur.t);\n  $('#dTitle').textContent=titleOf(cur);\n  $('#addRow').hidden=!(cur.t==='x'&&mode==='file');\n  $('#addRow').disabled=closed;\n  const ncol=cs.length+1+(cur.t==='x'?1:0);\n  const th='<tr><th style=\"width:44px\">No<\/th>'+cs.map(c=>'<th>'+c.l+'<\/th>').join('')+(cur.t==='x'?'<th style=\"width:40px\"><\/th>':'')+'<\/tr>';\n  let body;\n  if(!list.length){\n    body='<tr><td colspan=\"'+ncol+'\"><div class=\"empty\"><svg viewBox=\"0 0 24 24\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h4\"/><\/svg><span>'+(cur.t==='x'&&mode==='file'?'입력된 내용이 없습니다. [+ 행 추가]로 입력하세요.':'데이터가 없습니다.')+'<\/span><\/div><\/td><\/tr>';\n  }else body=list.map((r,i)=>{\n    let h='<tr data-i=\"'+i+'\"><td class=\"ct n\">'+(i+1)+'<\/td>';\n    cs.forEach(c=>{\n      const val=r[c.f];\n      if(!edit){\n        if(c.k==='num')h+='<td class=\"r\">'+fmt(val)+'<\/td>';\n        else if(c.f==='reg')h+='<td class=\"ct num\">'+esc(val)+'<\/td>';\n        else if(c.f==='unit'||c.f==='ym')h+='<td class=\"ct\">'+esc(c.f==='ym'?dot(val):val)+'<\/td>';\n        else h+='<td>'+esc(val)+'<\/td>';\n      }else if(c.k==='num')h+='<td><input class=\"cell in\" data-f=\"'+c.f+'\" inputmode=\"numeric\" value=\"'+fmt(val)+'\" aria-label=\"'+c.l+'\"><\/td>';\n      else if(c.k==='sel')h+='<td><select class=\"txt\" data-f=\"unit\" aria-label=\"'+c.l+'\"><option'+(val==='여'?' selected':'')+'>여<\/option><option'+(val==='부'?' selected':'')+'>부<\/option><\/select><\/td>';\n      else if(c.k==='month')h+='<td><input class=\"txt\" type=\"month\" data-f=\"ym\" value=\"'+esc(val)+'\" aria-label=\"'+c.l+'\"><\/td>';\n      else h+='<td><input class=\"txt'+(c.f==='reg'?' num':'')+'\" data-f=\"'+c.f+'\" value=\"'+esc(val)+'\" aria-label=\"'+c.l+'\"><\/td>';\n    });\n    if(cur.t==='x')h+=edit?'<td class=\"ct\"><button type=\"button\" class=\"eb\" data-del=\"'+i+'\" aria-label=\"행 삭제\" title=\"행 삭제\"><svg viewBox=\"0 0 16 16\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M3.5 3.5l9 9M12.5 3.5l-9 9\"/><\/svg><\/button><\/td>':'<td><\/td>';\n    return h+'<\/tr>';\n  }).join('')+'<tr class=\"fill\"><td colspan=\"'+ncol+'\"><\/td><\/tr>';\n  $('#dWrap').innerHTML='<table class=\"dtbl\"><thead>'+th+'<\/thead><tbody>'+body+'<\/tbody><tfoot id=\"dFoot\"><\/tfoot><\/table>';\n  detailFoot();\n}\n\n/* ---------- side totals ---------- */\nfunction renderAside(){\n  ['s','p'].forEach(k=>{\n    const e=smT(k,'e'),x=smT(k,'x');\n    $(k==='s'?'#asS':'#asP').innerHTML=\n      '<div class=\"sumline\"><span>전자<\/span><span class=\"num\">'+fmt(e.s)+'<\/span><\/div>'\n     +'<div class=\"sumline\"><span>전자 외<\/span><span class=\"num\">'+fmt(x.s)+'<\/span><\/div>'\n     +'<div class=\"sumline\"><span><b>합계<\/b><\/span><span class=\"num\"><b>'+fmt(e.s+x.s)+'<\/b><\/span><\/div>';\n  });\n}\nfunction refresh(full){renderSummary();renderAside();if(full)renderDetail();else detailFoot()}\n\n/* ---------- events ---------- */\nfunction toast(msg,ms){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},ms||2200)}\nfunction pickRow(tr){cur={k:tr.dataset.k,t:tr.dataset.t,id:tr.dataset.id};refresh(true)}\nconst editable=()=>cur.t==='x'&&mode==='file'&&!closed;\ndocument.addEventListener('click',e=>{\n  const tr=e.target.closest('tr.pick-row');if(tr){pickRow(tr);return}\n  const d=e.target.closest('[data-del]');\n  if(d&&editable()){DATA[cur.k][KEY(cur)].splice(+d.dataset.del,1);refresh(true)}\n});\ndocument.addEventListener('keydown',e=>{\n  const tr=e.target.closest&&e.target.closest('tr.pick-row');\n  if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pickRow(tr)}\n  if(e.key==='Escape')$$('.scrim').forEach(m=>m.hidden=true);\n  if(e.key==='Enter'&&e.target.matches('#dWrap input')){\n    const list=$$('#dWrap input').filter(x=>x.offsetParent!==null),i=list.indexOf(e.target);\n    if(i>-1&&list[i+1]){e.preventDefault();list[i+1].focus()}\n  }\n});\ndocument.addEventListener('input',e=>{\n  const el=e.target;if(!el.matches('#dWrap [data-f]')||!editable())return;\n  const tr=el.closest('tr'),r=DATA[cur.k][KEY(cur)][+tr.dataset.i],f=el.dataset.f;\n  if(['cnt','sup','tax'].includes(f)){\n    el.value=el.value.replace(/[^0-9,]/g,'');\n    r[f]=parse(el.value);\n    if(CFG.tax){\n      if(f==='sup'&&r.auto!==false){r.tax=Math.floor(r.sup/10);tr.querySelector('[data-f=\"tax\"]').value=fmt(r.tax)}\n      if(f==='tax')r.auto=false;\n    }\n    refresh(false);\n  }else r[f]=el.value;\n});\ndocument.addEventListener('change',e=>{\n  const el=e.target;\n  if(el.matches('#dWrap [data-f]')&&editable()){const tr=el.closest('tr');DATA[cur.k][KEY(cur)][+tr.dataset.i][el.dataset.f]=el.value}\n});\ndocument.addEventListener('focusin',e=>{if(e.target.matches('#dWrap input.cell'))setTimeout(()=>e.target.select(),0)});\ndocument.addEventListener('focusout',e=>{\n  const el=e.target;\n  if(el.matches('#dWrap input.cell')&&editable()){const tr=el.closest('tr');el.value=fmt(DATA[cur.k][KEY(cur)][+tr.dataset.i][el.dataset.f])}\n});\n$('#addRow').addEventListener('click',()=>{\n  if(!editable())return;\n  DATA[cur.k][KEY(cur)].push({name:'',reg:'',cnt:0,sup:0,tax:0,rep:'',liq:'',unit:'부',ym:RANGE.to});\n  refresh(true);\n  const rows=$$('#dWrap tbody tr');const last=rows[rows.length-1];\n  if(last){last.scrollIntoView({block:'nearest'});const f=last.querySelector('input');if(f)f.focus()}\n});\n\n/* ---------- period / lookup mode ---------- */\nfunction applyPeriod(){\n  const o=$('#periodSel').selectedOptions[0];\n  RANGE={from:o.dataset.from.replace('.','-'),to:o.dataset.to.replace('.','-')};\n  $('#dFrom').value=o.dataset.from;$('#dTo').value=o.dataset.to;$('#dueDate').textContent=o.dataset.due;\n}\nfunction syncButtons(){\n  const sub=mode==='sub',lock=sub||closed;\n  ['saveBtn','delBtn','ldBtn'].forEach(id=>{$('#'+id).disabled=lock});\n  $('#closeBtn').disabled=sub;\n  $('#addRow').disabled=lock;\n  $('#rptDate').disabled=lock;\n  $('#modeChip').textContent=sub?'제출용 조회':(closed?'마감':'작성 중');\n  $('#statTxt').textContent=closed?'마감':'미마감';\n}\nfunction setMode(m){\n  mode=m;const sub=m==='sub';\n  $('#subBtn').setAttribute('aria-pressed',String(sub));\n  $('#periodSel').disabled=sub;\n  const f=$('#dFrom'),t=$('#dTo');\n  f.type=sub?'month':'text';t.type=sub?'month':'text';\n  f.readOnly=!sub;t.readOnly=!sub;\n  f.style.width=t.style.width=sub?'140px':'80px';\n  if(sub){f.value=RANGE.from;t.value=RANGE.to}else applyPeriod();\n  $('#dueBox').hidden=sub;$('#subHint').hidden=!sub;\n  syncButtons();refresh(true);\n}\nfunction runQuery(){\n  if(mode==='sub'){\n    const a=$('#dFrom').value,b=$('#dTo').value;\n    if(!a||!b){toast('조회 기간을 선택하세요');return}\n    if(a>b){toast('시작월이 종료월보다 늦습니다');return}\n    RANGE={from:a,to:b};\n  }\n  refresh(true);toast('조회했습니다');\n}\nconst sm_=$('#subModal');\nfunction openSub(){$('#sbFrom').value=RANGE.from;$('#sbTo').value=RANGE.to;sm_.hidden=false;$('#sbFrom').focus()}\nfunction closeSub(){sm_.hidden=true}\n$('#subBtn').addEventListener('click',()=>{if(mode==='sub')setMode('file');else openSub()});\n$('#subX').addEventListener('click',closeSub);$('#subCancel').addEventListener('click',closeSub);\nsm_.addEventListener('click',e=>{if(e.target===sm_)closeSub()});\nfunction subRange(){\n  const a=$('#sbFrom').value,b=$('#sbTo').value;\n  if(!a||!b){toast('조회 기간을 선택하세요');return false}\n  if(a>b){toast('시작월이 종료월보다 늦습니다');return false}\n  RANGE={from:a,to:b};return true;\n}\n$('#subGo').addEventListener('click',()=>{if(!subRange())return;closeSub();setMode('sub');toast('제출용 자료를 조회했습니다')});\n$('#subPrint').addEventListener('click',()=>{if(!subRange())return;closeSub();setMode('sub');try{window.print()}catch(e){}});\n$('#periodSel').addEventListener('change',()=>{applyPeriod();refresh(true)});\n$('#qBtn').addEventListener('click',runQuery);\n['dFrom','dTo'].forEach(id=>$('#'+id).addEventListener('change',()=>{if(mode==='sub')runQuery()}));\n\n/* header buttons */\n$('#ldBtn').addEventListener('click',()=>toast(CFG.loadMsg));\n$('#saveBtn').addEventListener('click',()=>toast('저장되었습니다'));\n$('#printBtn').addEventListener('click',()=>{try{window.print()}catch(e){}});\nfunction setClosed(on){\n  closed=on;\n  $('#closeBtn').setAttribute('aria-pressed',String(on));\n  $('#closeTxt').textContent=on?'마감취소':'마감';\n  syncButtons();refresh(true);\n}\n$('#closeBtn').addEventListener('click',()=>{\n  if(closed){setClosed(false);toast('마감을 취소했습니다');return}\n  const bad=['s','p'].some(k=>['xb','xr'].some(id=>DATA[k][id].some(r=>!r.name.trim()||!r.reg.trim())));\n  if(bad){toast('거래처명과 등록번호가 비어 있는 전자 외 행이 있습니다');return}\n  setClosed(true);toast('마감되었습니다');\n});\n\n/* 홈택스 자료조회 = 홈택스 전자(세금)계산서 목록조회와 대사 */\n$('#htBtn').addEventListener('click',runRecon);\n\n/* theme */\nfunction applyTheme(t){document.documentElement.setAttribute('data-theme',t)}\nlet theme='dark';try{theme=localStorage.getItem('selfbooks-theme')||'dark'}catch(e){}\napplyTheme(theme);\n$('#themeBtn').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';applyTheme(theme);try{localStorage.setItem('selfbooks-theme',theme)}catch(e){}});\n\napplyPeriod();\nsyncButtons();\nrefresh(true);\nrunRecon(true);\n\n<\/script>\n",crv:"<title>신용카드매출전표등수령명세서<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap\">\n<style>\n/* Layout: sticky top bar -> filter band (기수, 기간, 신고구분, 조회) -> [신고서 표 | 연결 자료 3단 패널 | 세액정보·작성요령].\n   Dark first, gold accent, monospaced numerals, same system as the other SelfBooks screens; light theme is the override. */\n:root{\n  --bg:#12161C; --surface:#181D25; --surface-2:#1E252F; --line:#2B3340; --line-soft:#252D39;\n  --fg:#E7EAF0; --fg-2:#B4BCC9; --muted:#8892A2;\n  --accent:#D9A441; --accent-fg:#1B1404; --accent-soft:rgba(217,164,65,.13);\n  --in-bg:#12171E; --derived-bg:#1C232D; --off-bg:#0F1318; --off-line:#1B222B;\n  --diff-bg:rgba(109,168,230,.16);\n  --ok:#5DBB8D; --warn:#E58A4B; --bad:#E5706F; --info:#6DA8E6;\n  --ht-bg:#FFFFFF; --ht-fg:#1E3A8A; --ht-line:#C9D3EA;\n  --shadow:0 8px 28px rgba(0,0,0,.45);\n  --f-ui:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;\n  --f-num:'JetBrai v class=\"swrap\"><table class=\"stbl\"><thead><tr><th>구분<\/th><th>거래건수<\/th><th>공급가액<\/th><th>세액<\/th><\/tr><\/thead><tbody id=\"gap\"><\/tbody><\/table><\/div><\/section>\n<section class=\"card\" style=\"margin-top:16px\"><div class=\"card-h\"><h2>그 밖의 신용·직불카드, 기명식선불카드, 직불전자지급수단 및 기명식선불전자지급수단 매출전표 수령금액 합계<\/h2><button type=\"button\" class=\"btn\" id=\"addRow\">+ 행 추가<\/button><\/div>\n <div class=\"dwrap\" id=\"eul\"><\/div><\/section>\n<\/div>\n<\/div><\/div><\/main>\n<div class=\"scrim\" id=\"bsModal\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bsTitle\"><div class=\"dlg\" style=\"width:min(720px,100%)\"><h2 id=\"bsTitle\">사업자 상태조회<\/h2><div class=\"b\">\n<div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><label class=\"l\" for=\"bsNo\">사업자등록번호<\/label><input class=\"txt num\" id=\"bsNo\" placeholder=\"000-00-00000\" style=\"width:150px\"><button type=\"button\" class=\"btn\" id=\"bsOne\">조회<\/button><span id=\"bsRes\" class=\"hint\"><\/span><\/div>\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:6px\"><b style=\"font-size:12.5px\">수령명세서 거래처<\/b><span class=\"hint\" id=\"bsAt\"><\/span><\/div>\n<div style=\"border:1px solid var(--line);border-radius:6px;max-height:280px;overflow:auto\"><table class=\"stbl\"><thead><tr><th>상호<\/th><th>사업자등록번호<\/th><th>사업자상태<\/th><th>과세유형<\/th><th>폐업일<\/th><\/tr><\/thead><tbody id=\"bsBody\"><\/tbody><\/table><\/div>\n<p class=\"hint\" style=\"margin:0\">국세청 사업자등록 상태(계속·휴업·폐업)와 과세유형을 조회합니다.<\/p><\/div>\n<div class=\"ft\"><button type=\"button\" class=\"btn\" id=\"bsAll\">전체 조회<\/button><button type=\"button\" class=\"btn primary\" id=\"bsClose\">닫기<\/button><\/div><\/div><\/div>\n<div class=\"scrim\" id=\"bcModal\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bcTitle\"><div class=\"dlg\" style=\"width:min(520px,100%)\"><h2 id=\"bcTitle\">일괄변경<\/h2><div class=\"b\" style=\"gap:12px\">\n<div style=\"display:grid;grid-template-columns:150px m '')+Math.abs(Math.trunc(n)).toLocaleString('en-US');\nconst parse=s=>{const d=String(s).replace(/[^0-9]/g,'');return d?parseInt(d,10):0};\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/\"/g,'&quot;');\nlet closed=false;\nfunction toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},ms||2200)}\nfunction applyPeriod(){const o=$('#periodSel').selectedOptions[0];$('#dFrom').value=o.dataset.from;$('#dTo').value=o.dataset.to;$('#dueDate').textContent=o.dataset.due;}\nfunction syncLock(){['saveBtn','delBtn','ldBtn'].forEach(i=>$('#'+i).disabled=closed);$('#modeChip').textContent=closed?'마감':'작성 중';$('#statTxt').textContent=closed?'마감':'미마감';$$('[data-edit]').forEach(x=>x.disabled=closed)}\nfunction bindCommon(redraw,validate){\n  $('#periodSel').addEventListener('change',()=>{applyPeriod();redraw()});\n  $('#qBtn').addEventListener('click',()=>{redraw();toast('조회했습니다')});\n  $('#ldBtn').addEventListener('click',()=>toast('환경등록 연동 자료를 불러왔습니다'));\n  $('#saveBtn').addEventListener('click',()=>toast('저장되었습니다'));\n  $('#printBtn').addEventListener('click',()=>{try{window.print()}catch(e){}});\n  const cb=$('#closeBtn');if(cb)cb.addEventListener('click',()=>{\n    if(closed){closed=false;$('#closeBtn').setAttribute('aria-pressed','false');$('#closeTxt').textContent='마감';syncLock();redraw();toast('마감을 취소했습니다');return}\n    const m=validate&&validate();if(m){toast(m);return}\n    closed=true;$('#closeBtn').setAttribute('aria-pressed','true');$('#closeTxt').textContent='마감취소';syncLock();redraw();toast('마감되었습니다');\n  });\n  const ht=$('#htModal');if(ht&&$('#htBtn')){$('#htBtn').addEventListener('click',()=>{ht.hidden=false;$('#htClose').focus()});\n  $('#htClose').addEventListener('click',()=>{ht.hidden=true});ht.addEventListener('click',e=>{if(e.target===ht)ht.hidden=true});\n  $('#htGo').addEventListener('click',()=>{ht.hidden=true;toast('선택한 자료를 조회합니다')})}\n  document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.scrim').forEach(m=>m.hidden=true)});\n  document.addEventListener('focusin',e=>{if(e.target.matches('input.cell'))setTimeout(()=>e.target.select(),0)});\n  let th='dark';try{th=localStorage.getItem('selfbooks-theme')||'dark'}catch(e){}\n  document.documentElement.setAttribute('data-theme',th);\n  $('#themeBtn').addEventListener('click',()=>{th=th==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',th);try{localStorage.setItem('selfbooks-theme',th)}catch(e){}});\n  applyPeriod();syncLock();redraw();\n}\n\nconst TL=['1. 현금영수증','2. 사업용','3. 화물운전자복지','0. 기타'];\nconst GR=[{l:'현금영수증',k:0},{l:'화물 운전자 복지카드',k:2},{l:'사업용 신용카드',k:1},{l:'기타 신용카드',k:3}];\nconst L=[\n {k:1,d:'2026-04-27',s:5454546,t:545454,cnt:1,n:'파온스윙',r:'707-15-01273',m:'국민카드',c:'5585-2695-1779-6820',a:''},\n {k:1,d:'2026-04-27',s:1818182,t:181818,cnt:1,n:'파온스윙',r:'707-15-01273',m:'국민카드',c:'5585-2695-1779-6820',a:''},\n {k:1,d:'2026-05-27',s:8181819,t:818181,cnt:1,n:'파온스윙',r:'707-15-01273',m:'국민카드',c:'5585-2695-1779-6820',a:''},\n {k:1,d:'2026-06-29',s:9090910,t:909090,cnt:1,n:'파온(paron)',r:'407-33-00529',m:'국민카드',c:'5585-2695-1779-6820',a:''}];\nlet RNG={from:'2026-04',to:'2026-06'};\nfunction applyPeriod(){const o=$('#periodSel').selectedOptions[0];$('#dFrom').value=o.dataset.from.replace('.','-');$('#dTo').value=o.dataset.to.replace('.','-');RNG={from:$('#dFrom').value,to:$('#dTo').value};$('#dueDate').textContent=o.dataset.due;}\nconst vis=()=>L.filter(r=>r.d.slice(0,7)>=RNG.from&&r.d.slice(0,7)<=RNG.to);\nconst add=(l)=>l.reduce((o,r)=>({c:o.c+r.cnt,s:o.s+r.s,t:o.t+r.t}),{c:0,s:0,t:0});\nfunction gap(){\n  const v=vis(),T=add(v);\n  const row=(l,x,cls)=>'<tr class=\"'+(cls||'')+'\"><td class=\"ct\" style=\"text-align:left;padding-left:10px\">'+l+'<\/td><td class=\"r\">'+fmt(x.c)+'<\/td><td class=\"r\">'+fmt(x.s)+'<\/td><td class=\"r\">'+fmt(x.t)+'<\/td><\/tr>';\n  $('#gap').innerHTML=row('합계',T,'total')+GR.map(g=>row(g.l,add(v.filter(r=>r \"display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px\"><label class=\"l\" for=\"nsA\">취득가액 총계<\/label><input class=\"txt num\" id=\"nsA\" readonly style=\"text-align:right;width:190px;flex:none\"><label class=\"l\" for=\"nsT\">매입세액공제 총계<\/label><input class=\"txt num\" id=\"nsT\" readonly style=\"text-align:right;width:190px;flex:none\"><\/div>\n      <p class=\"hint\" style=\"margin:10px 0 0\">예정신고 때 빠뜨린 면세농산물등 매입입니다. 합계는 일반과세 신고서 (42)번 그 밖의 공제매입세액(예정신고 누락분)으로 반영됩니다.<\/p>\n    <\/div>\n    <div class=\"ft\"><button type=\"button\" class=\"btn\" id=\"nsCancel\">취소<\/button><button type=\"button\" class=\"btn primary\" id=\"nsOk\">확인<\/button><\/div>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n<script>\n\nconst $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));\nconst fmt=n=>(n<0?'-':'')+Math.abs(Math.trunc(n)).toLocaleString('en-US');\nconst parse=s=>{const d=String(s).replace(/[^0-9]/g,'');return d?parseInt(d,10):0};\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/\"/g,'&quot;');\nlet closed=false;\nfunction toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},ms||2200)}\nfunction applyPeriod(){const o=$('#periodSel').selectedOptions[0];$('#dFrom').value=o.dataset.from;$('#dTo').value=o.dataset.to;$('#dueDate').textContent=o.dataset.due;}\nfunction syncLock(){['saveBtn','delBtn','ldBtn'].forEach(i=>$('#'+i).disabled=closed);$('#modeChip').textContent=closed?'마감':'작성 중';$('#statTxt').textContent=closed?'마감':'미마감';$$('[data-edit]').forEach(x=>x.disabled=closed)}\nfunction bindCommon(redraw,validate){\n  $('#periodSel').addEventListener('change',()=>{applyPeriod();redraw()});\n  $('#qBtn').addEventListener('click',()=>{redraw();toast('조회했습니다')});\n  $('#ldBtn').addEventListener('click',()=>toast('환경등록 연동 자료를 불러왔습니다'));\n  $('#saveBtn').addEventListener('click',()=>toast('저장되었습니다'));\n  $('#printBtn').addEventListener('click',()=>{try{window.print()}catch(e){}});\n  const cb=$('#closeBtn');if(cb)cb.addEventListener('click',()=>{\n    if(closed){closed=false;$('#closeBtn').setAttribute('aria-pressed','false');$('#closeTxt').textContent='마감';syncLock();redraw();toast('마감을 취소했습니다');return}\n    const m=validate&&validate();if(m){toast(m);return}\n    closed=true;$('#closeBtn').setAttribute('aria-pressed','true');$('#closeTxt').textContent='마감취소';syncLock();redraw();toast('마감되었습니다');\n  });\n  const ht=$('#htModal');if(ht&&$('#htBtn')){$('#htBtn').addEventListener('click',()=>{ht.hidden=false;$('#htClose').focus()});\n  $('#htClose').addEventListener('click',()=>{ht.hidden=true});ht.addEventListener('click',e=>{if(e.target===ht)ht.hidden=true});\n  $('#htGo').addEventListener('click',()=>{ht.hidden=true;toast('선택한 자료를 조회합니다')})}\n  document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.scrim').forEach(m=>m.hidden=true)});\n  document.addEventListener('focusin',e=>{if(e.target.matches('input.cell'))setTimeout(()=>e.target.select(),0)});\n  let th='dark';try{th=localStorage.getItem('selfbooks-theme')||'dark'}catch(e){}\n  document.documentElement.setAttribute('data-theme',th);\n  $('#themeBtn').addEventListener('click',()=>{th=th==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',th);try{localStorage.setItem('selfbooks-theme',th)}catch(e){}});\n  applyPeriod();syncLock();redraw();\n}\n\nconst KD=['계산서','신용카드등','농·어민등'];\nconst SUPS=[{n:'청정수산',r:'214-81-35210'},{n:'햇살농산',r:'120-86-48217'},{n:'푸른닭고기',r:'107-81-62334'},{n:'우리농협 하나로마트',r:'305-81-17764'}];\nconst ROWS=[\n {s:0,d:'2026-01-13',k:0,it:'고등어',q:'20kg',a:2100000,c:1},{s:0,d:'2026-03-10',k:0,it:'갈치',q:'18kg',a:2300000,c:1},{s:0,d:'2026-05-12',k:0,it:'오징어',q:'25kg',a:1800000,c:1},\n {s:1,d:'2026-02-04',k:0,it:'양파·대파',q:'150kg',a:2400000,c:1},{s:1,d:'2026-04-21',k:0,it:'배추·무',q:'190kg',a:2400000,c:1},\n {s:2,d:'2026-01-28',k:0,it:'닭고기(국내산)',q:'110kg',a:1200000,c:1},{s:2,d:'2026-03-25',k:0,it:'닭고기(국내산)',q:'120kg',a:1300000,c:1},{s:2,d:'2026-05-06',k:0,it:'닭고기(국내산)',q:'110kg',a:1250000,c:1},{s:2,d:'2026-06-10',k:0,it:'닭고기(국내산)',q:'110kg',a:1250000,c:1},\n {s:3,d:'2026-02-18',k:1,it:'과일',q:'-',a:1100000,c:1},{s:3,d:'2026-06-02',k:1,it:'채소',q:'-',a:1300000,c:1}];\nROWS.forEach(r=>{r.rate='9/109'});\nlet SEL=0,RNG={from:'2026-01',to:'2026-06'};\nconst S={bt:'p',ind:'a',ex:0,fx:148200000,pre:0,adv:0,limOv:null,ri:null,\n m:{b1:0,b2:0,p1:0,p2:0,pre1:0,ex2:0,adv2:0,lim:null,rate:null}};\nconst RATES=['2/102','4/104','6/106','8/108','9/109'];\nconst LIMS=[[75,'음식 1억 이하'],[70,'음식 2억 이하'],[60,'음식 2억 초과'],[65,'기타 2억 이하'],[55,'기타 2억 초과']];\nconst LIMM=[[65,'기타 4억 이하'],[55,'기타 4억 초과']];\nconst isFood=()=>S.ind==='a'||S.ind==='b';\nconst baseTot=()=>S.ex+S.fx;\nfunction defRate(){const i=S.ind,b=S.bt,x=baseTot();\n if(i==='b')return'2/102';\n if(i==='a')return b==='p'?(x<=200000000?'9/109':'8/108'):'6/106';\n if(i==='c')return b==='p'?'6/106':'2/102';\n if(i==='d')return'4/104';return'2/102'}\nfunction defLim(x,ann){if(S.bt==='c')return 50;\n if(ann)return x<=400000000?65:55;\n if(isFood())return x<=100000000?75:(x<=200000000?70:60);\n return x<=200000000?65:55}\nconst RLP=['2/102','8/108','9/109','4/104','2/102,4/104,8/108','2/102,8/108','2/102,4/104','4/104,8/108','2/102,4/104,9/109','2/102,9/109','4/104,9/109','6/106','2/102,6/106','4/104,6/106','2/102,4/104,6/106'];\nconst RLC=['2/102','6/106','4/104','2/102,4/104,6/106','2/102,6/106','2/102,4/104','4/104,6/106'];\nconst RL=()=>S.bt==='p'?RLP:RLC;\nconst defIdx=()=>{const i=RL().indexOf(defRate());return i<0?0:i};\nconst ri=()=>S.ri!==null?S.ri:defIdx();\nconst RS=()=>RL()[ri()].split(',');\nconst rrate=r=>r.rate||RS()[0];\nconst txr=(a,rate)=>{const x=rate.split('/').map(Number);return Math.floor(a*x[0]/x[1])};\nconst rtxt=l=>{const q=[...new Set(l.map(rrate))];return (q.length?q:RS()).join(', ')};\nconst rt=()=>RS()[0].split('/').map(Number);\nfunction remapRates ap:wrap\"><label class=\"l\" for=\"rtN\">일괄변경할 공제율 :<\/label>\n        <input class=\"txt num\" id=\"rtN\" inputmode=\"numeric\" maxlength=\"2\" style=\"width:64px;text-align:center\" aria-label=\"분자\"><span aria-hidden=\"true\">/<\/span>\n        <input class=\"txt num\" id=\"rtD\" inputmode=\"numeric\" maxlength=\"3\" style=\"width:72px;text-align:center\" aria-label=\"분모\"><\/div>\n      <p class=\"hint\" style=\"margin:10px 0 0\">관리용 모든 매입 행과 계산 표(면세농산물등·제조업)의 공제율이 한 번에 바뀝니다.<\/p>\n    <\/div>\n    <div class=\"ft\"><button type=\"button\" class=\"btn\" id=\"rtCancel\">취소<\/button><button type=\"button\" class=\"btn primary\" id=\"rtOk\">확인<\/button><\/div>\n  <\/div>\n<\/div>\n<div class=\"scrim\" id=\"nsModal\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"nsTitle\">\n  <div class=\"dlg wide\" style=\"width:min(1120px,96vw)\">\n    <h2 id=\"nsTitle\" style=\"display:flex;justify-content:space-between;align-items:center\">예정신고누락분<button type=\"button\" class=\"eb\" id=\"nsX\" aria-label=\"닫기\">✕<\/button><\/h2>\n    <div class=\"b\">\n      <div class=\"mg\" style=\"padding:0\"><div><div class=\"slist\"><div class=\"sh\"><span>공급자<\/span><span>사업자(주민)번호<\/span><\/div><div id=\"nsSup\" style=\"min-height:260px\"><\/div><\/div>\n        <button type=\"button\" class=\"btn\" id=\"nsAddSup\" style=\"margin-top:8px;width:100%\">+ 공급자 추가<\/button><\/div>\n        <div><div style=\"display:flex;justify-content:flex-end;margin-bottom:6px\"><button type=\"button\" class=\"btn\" id=\"nsAddRow\">+ 행 추가<\/button><\/div><div class=\"dwrap\" id=\"nsTbl\" style=\"min-height:260px\"><\/div><\/div><\/div>\n      <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px\"><label class=\"l\" for=\"nsA\">취득가액 총계<\/label><input class=\"txt num\" id=\"nsA\" readonly style=\"text-align:right;width:190px;flex:none\"><label class=\"l\" for=\"nsT\">매입세액공제 총계<\/label><input class=\"txt num\" id=\"nsT\" readonly style=\"text-align:right;width:190px;flex:none\"><\/div>\n      <p class=\"hint\" style=\"margin:10px 0 0\">예정신고 때 빠뜨린 면세농산물등 매입입니다. 합계는 일반과세 신고서 (42)번 그 밖의 공제매입세액(예정신고 누락분)으로 반영됩니다.<\/p>\n    <\/div>\n    <div class=\"ft\"><button type=\"button\" class=\"btn\" id=\"nsCancel\">취소<\/button><button type=\"button\" class=\"btn primary\" id=\"nsOk\">확인<\/button><\/div>\n  <\/div>\n<\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n<script>\n\nconst $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));\nconst fmt=n=>(n<0?'-':'')+Math.abs(Math.trunc(n)).toLocaleString('en-US');\nconst parse=s=>{const d=String(s).replace(/[^0-9]/g,'');return d?parseInt(d,10):0};\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/\"/g,'&quot;');\nlet closed=false;\nfunction toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},ms||2200)}\nfunction applyPeriod(){const o=$('#periodSel').selectedOptions[0];$('#dFrom').value=o.dataset.from;$('#dTo').value=o.dataset.to;$('#dueDate').textContent=o.dataset.due;}\nfunction syncLock(){['saveBtn','delBtn','ldBtn'].forEach(i=>$('#'+i).disabled=closed);$('#modeChip').textContent=closed?'마감':'작성 중';$('#statTxt').textContent=closed?'마감':'미마감';$$('[data-edit]').forEach(x=>x.disabled=closed)}\nfunction bindCommon(redraw,validate){\n  $('#periodSel').addEventListener('change',()=>{applyPeriod();redraw()});\n  $('#qBtn').addEventListener('click',()=>{redraw();toast('조회했습니다')});\n  $('#ldBtn').addEventListener('click',()=>toast('환경등록 연동 자료를 불러왔습니다'));\n  $('#saveBtn').addEventListener('click',()=>toast('저장되었습니다'));\n  $('#printBtn').addEventListener('click',()=>{try{window.print()}catch(e){}});\n  const cb=$('#closeBtn');if(cb)cb.addEventListener('click',()=>{\n    if(closed){closed=false;$('#closeBtn').setAttribute('aria-pressed','false');$('#closeTxt').textContent='마감';syncLock();redraw();toast('마감을 취소했습니다');return}\n    const m=validate&&validate();if(m){toast(m);return}\n    closed=true;$('#closeBtn').setAttribute('aria-pressed','true');$('#closeTxt').textContent='마감취소';syncLock();redraw();toast('마감되었습니다');\n  });\n  const ht=$('#htModal');if(ht&&$('#htBtn')){$('#htBtn').addEventListener('click',()=>{ht.hidden=false;$('#htClose').focus()});\n  $('#htClose').addEventListener('click',()=>{ht.hidden=true});ht.addEventListener('click',e=>{if(e.target===ht)ht.hidden=true});\n  $('#htGo').addEventListener('click',()=>{ht.hidden=true;toast('선택한 자료를 조회합니다')})}\n  document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.scrim').forEach(m=>m.hidden=true)});\n  document.addEventListener('focusin',e=>{if(e.target.matches('input.cell'))setTimeout(()=>e.target.select(),0)});\n  let th='dark';try{th=localStorage.getItem('selfbooks-theme')||'dark'}catch(e){}\n  document.documentElement.setAttribute('data-theme',th);\n  $('#themeBtn').addEventListener('click',()=>{th=th==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',th);try{localStorage.setItem('selfbooks-theme',th)}catch(e){}});\n  applyPeriod();syncLock();redraw();\n}\n\nconst KD=['계산서','신용카드등','농·어민등'];\nconst SUPS=[{n:'청정수산',r:'214-81-35210'},{n:'햇살농산',r:'120-86-48217'},{n:'푸른닭고기',r:'107-81-62334'},{n:'우리농협 하나로마트',r:'305-81-17764'}];\nconst ROWS=[\n {s:0,d:'2026-01-13',k:0,it:'고등어',q:'20kg',a:2100000,c:1},{s:0,d:'2026-03-10',k:0,it:'갈치',q:'18kg',a:2300000,c:1},{s:0,d:'2026-05-12',k:0,it:'오징어',q:'25kg',a:1800000,c:1},\n {s:1,d:'2026-02-04',k:0,it:'양파·대파',q:'150kg',a:2400000,c:1},{s:1,d:'2026-04-21',k:0,it:'배추·무',q:'190kg',a:2400000,c:1},\n {s:2,d:'2026-01-28',k:0,it:'닭고기(국내산)',q:'110kg',a:1200000,c:1},{s:2,d:'2026-03-25',k:0,it:'닭고기(국내산)',q:'120kg',a:1300000,c:1},{s:2,d:'2026-05-06',k:0,it:'닭고기(국내산)',q:'110kg',a:1250000,c:1},{s:2,d:'2026-06-10',k:0,it:'닭고기(국내산)',q:'110kg',a:1250000,c:1},\n {s:3,d:'2026-02-18',k:1,it:'과일',q:'-',a:1100000,c:1},{s:3,d:'2026-06-02',k:1,it:'채소',q:'-',a:1300000,c:1}];\nROWS.forEach(r=>{r.rat )-Math.max(a,ms)+1;\n    if(o>0){rent+=t.rent*o/dm;mng+=t.mng*o/dm}}\n  const r10=Math.round(RATE()*10);\n  return {a,b,days,rent:Math.round(rent),mng:Math.round(mng),int:Math.round(t.dep*r10*days/(1000*Y))};\n}\nconst ds=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};\nfunction tsum(t){const o={rent:0,mng:0,int:0};t.c.forEach(c=>{const k=calc(c,t);if(k){o.rent+=k.rent;o.mng+=k.mng;o.int+=k.int}});o.tax=o.rent+o.mng+o.int;return o}\nfunction drawT(){\n  const ed=!closed;\n  $('#tWrap').innerHTML='<table class=\"tl\"><thead><tr><th>No<\/th><th>코드<\/th><th>거래처명(임차인)<\/th><th>동<\/th><th>층<\/th><th>호<\/th><\/tr><\/thead><tbody>'\n   +TEN.map((t,i)=>'<tr data-i=\"'+i+'\"'+(i===SEL?' class=\"sel\"':'')+'><td class=\"n\">'+(i+1)+'<\/td>'\n    +'<td>'+(ed?'<input class=\"txt\" data-t=\"code\" value=\"'+esc(t.code)+'\" style=\"text-align:center\">':esc(t.code))+'<\/td><td>'+(ed?'<input class=\"txt\" data-t=\"n\" value=\"'+esc(t.n)+'\">':esc(t.n))+'<\/td><td>'+(ed?'<input class=\"txt\" data-t=\"dong\" value=\"'+esc(t.dong)+'\">':esc(t.dong))+'<\/td><td>'+(ed?'<input class=\"txt\" data-t=\"fl\" value=\"'+esc(t.fl)+'\">':esc(t.fl))+'<\/td><td>'+(ed?'<input class=\"txt\" data-t=\"ho\" value=\"'+esc(t.ho)+'\">':esc(t.ho))+'<\/td>'\n    +'<\/tr>').join('')+'<tr class=\"fill\"><td colspan=\"6\"><\/td><\/tr><\/tbody><\/table>';\n  $('#addT').disabled=closed;\n}\nfunction drawD(){\n  const t=TEN[SEL],ed=!closed;\n  if(!t){$('#regBox').innerHTML='';$('#cWrap').innerHTML='';$('#kWrap').innerHTML='';$('#tTitle').textContent='등록사항';return}\n  $('#tTitle').textContent=(t.n||'(신규)')+' · 등록사항';\n  const f=(l,k,ph)=>'<label>'+l+'<\/label>'+(ed?'<input class=\"txt\" data-r=\"'+k+'\" value=\"'+esc(t[k])+'\"'+(ph?' placeholder=\"'+ph+'\"':'')+'>':'<span>'+esc(t[k])+'<\/span>');\n  const fn=(l,k)=>'<label>'+l+'<\/label>'+(ed?'<input class=\"cell in\" data-rn=\"'+k+'\" inputmode=\"numeric\" value=\" " stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11\"/><\/svg>\n          불러오기\n        <\/button>\n        <button type=\"button\" class=\"btn ico\" id=\"printBtn\" aria-label=\"인쇄\" title=\"인쇄\">\n          <svg viewBox=\"0 0 16 16\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M4 6V2h8v4M4 12H2.5V6h11v6H12M4 9.5h8V14H4z\"/><\/svg>\n        <\/button>\n        <button type=\"button\" class=\"btn ico\" id=\"themeBtn\" aria-label=\"다크/라이트 모드 전환\" title=\"다크/라이트 모드\">\n          <svg viewBox=\"0 0 16 16\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z\"/><\/svg>\n        <\/button>\n      <\/div>\n      <div class=\"group\">\n        <button type=\"button\" class=\"btn primary\" id=\"saveBtn\">\n          <svg viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M2.5 2.5h9l2 2v9h-11zM5 2.5v3.5h5V2.5M5 13.5V9h6v4.5\"/><\/svg>\n          저장\n        <\/button>\n        <button type=\"button\" class=\"btn danger\" id=\"delBtn\">\n          <svg viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4\"/><\/svg>\n          삭제\n        <\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<div class=\"ctx\">\n  <div class=\"inner\">\n    <div class=\"co\"><span class=\"code\">101<\/span><strong>동네치킨<\/strong><span class=\"chip\">개인 · 일반과세자<\/span><\/div>\n    <div class=\"flt\">\n      <label class=\"l\" for=\"periodSel\" style=\"display:none\" hidden>기수<\/label>\n      <select class=\"txt\" id=\"periodSel\" style=\"display:none\" hidden aria-hidden=\"true\" tabindex=\"-1\">\n        <option value=\"2026-1\" data-from=\"2026.01\" data-to=\"2026.06\" data-due=\"2026.07.27\" selected>2026년 제1기 확정<\/option>\n        <option value=\"2025-2\" data-from=\"2025.07\" data-to=\"2025.12\" data-due=\"2026.01.26\">2025년 제2기 확정<\/option>\n      <\/select>\n      <label class=\"l\" for=\"dFrom\">기간<\/label>\n      <input class=\"txt dt\" id=\"dFrom\" value=\"2026.01\" readonly style=\"width:80px\">\n      <span aria-hidden=\"true\">~<\/span>\n      <input class=\"txt dt\" id=\"dTo\" value=\"2026.06\" readonly aria-label=\"기간 종료\" style=\"width:80px\">\n    <\/div>\n    <button type=\"button\" class=\"btn\" id=\"qBtn\">조회<\/button>\n    <div class=\"due\">\n      <span>신고·납부기한 <b id=\"dueDate\">2026.07.27<\/b><\/span>\n      <span class=\"fin\"><span>마감여부 (신고서 마감 연동)<\/span> <b id=\"statTxt\">미마감<\/b><\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<main><div class=\"inner\"><div class=\"we\">\n<div class=\"col\">\n <section class=\"card\"><div class=\"card-h\"><h2>전자세금계산서 발급세액공제 대상 여부(⑥)<\/h2><\/div>\n  <p class=\"cap\">※ 해당 세액공제는 직전연도 사업장별 공급가액(면세공급가액 포함) 합계액 3억원 미만 개인사업자 대상입니다.<br>※ 간이과세자는 2023년 07월부터 전자세금계산서 발급세액공제 대상입니다.(전자신고 가능)<\/p>\n  <div style=\"padding:10px 16px 16px\"><table class=\"et\"><tbody><tr><th style=\"width:26%\">직전연도 공급가액<\/th><td style=\"width:34%\"><input class=\"cell num\" id=\"prev\" data-edit inputmode=\"numeric\" autocomplete=\"off\" aria-label=\"직전연도 공급가액\"><\/td><th style=\"width:20%\">대상 여부<\/th><td id=\"elig\"><\/td><\/tr><\/tbody><\/table><\/div><\/section>\n <section class=\"card\"><div class=\"card-h\"><h2>공제대상액 및 공제한도액계산(가~나)<\/h2><\/div>\n  <div style=\"padding:10px 16px 16px;display:grid;gap:10px\"><table class=\"et\" id=\"calcA\"><\/table><table class=\"et\" id=\"calcB\"><\/table><\/div><\/section>\n <section class=\"card\"><div class=\"card-h\"><h2>공제금액<\/h2><\/div>\n  <div style=\"padding:10px 16px 16px\"><table class=\"et\" id=\"amtT\"><\/table><\/div><\/section>\n<\/div>\n<section class=\"card\"><div class=\"card-h\"><h2>공제한도액 계산명세<\/h2><\/div><div style=\"padding:10px 16px 16px;overflow-x:auto\"><table class=\"et\" id=\"detT\"><\/table><\/div><\/section>\n<\/div><\/div><\/main>\n<div class=\"scrim\" id=\"htModal\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"htTitle\">\n  <div class=\"dlg\">\n    <h2 id=\"htTitle\">홈택스 자료조회<\/h2>\n    <div class=\"b\">\n      <div class=\"hint\">조회기간 <span class=\"num\" id=\"htPeriod\">2026.01.01 ~ 2026.06.30<\/span><\/div>\n      <label class=\"ck\"><input type=\"checkbox\" checked> 전자세금계산서 (매출·매입)<\/label>\n      <label class=\"ck\"><input type=\"checkbox\" checked> 전자계산서 (매출·매입)<\/label>\n      <label class=\"ck\"><input type=\"checkbox\" checked> 신용카드 매입 (사업용카드)<\/label>\n      <label class=\"ck\"><input type=\"checkbox\" checked> 현금영수증 매입<\/label>\n      <label class=\"ck\"><input type=\"checkbox\" checked> 신용카드·현금영수증 발행분 (매출)<\/label>\n      <label class=\"ck\"><input type=\"checkbox\"> 판매·결제대행 매출<\/label>\n    <\/div>\n    <div class=\"ft\"><button type=\"button\" class=\"btn\" id=\"htClose\">닫기<\/button><button type=\"button\" class=\"btn primary\" id=\"htGo\">조회<\/button><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\" role=\"status\" hidden><\/div>\n<script>\n\nconst $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));\nconst fmt=n=>(n<0?'-':'')+Math.abs(Math.trunc(n)).toLocaleString('en-US');\nconst parse=s=>{const d=String(s).replace(/[^0-9]/g,'');return d?parseInt(d,10):0};\nconst esc=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/\"/g,'&quot;');\nlet closed=false;\nfunction toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},ms||2200)}\nfunction applyPeriod(){const o=$('#periodSel').selectedOptions[0];$('#dFrom').value=o.dataset.from;$('#dTo').value=o.dataset.to;$('#dueDate').textContent=o.dataset.due;}\nfunction syncLock(){['saveBtn','delBtn','ldBtn'].forEach(i=>$('#'+i).disabled=closed);$('#modeChip').textContent=closed?'마감':'작성 중';$('#statTxt').textContent=closed?'마감':'미마감';$$('[data-edit]').forEach(x=>x.disabled=closed)}\nfunction bindCommon(redraw,validate){\n  $('#periodSel').addEventListener('change',()=>{applyPeriod();redraw()});\n  $('#qBtn').addEventListener('click',()=>{redraw();toast('조회했습니다')});\n  $('#saveBtn').addEventListener('click',()=>toast('저장되었습니다'));\n  $('#printBtn').addEventListener('click',()=>{try{window.print()}catch(e){}});\n  const cb=$('#closeBtn');if(cb)cb.addEventListener('click',()=>{\n    if(closed){closed=false;$('#closeBtn').setAttribute('aria-pressed','false');$('#closeTxt').textContent='마감';syncLock();redraw();toast('마감을 취소했습니다');return}\n    const m=validate&&validate();if(m){toast(m);return}\n    closed=true;$('#closeBtn').setAttribute('aria-pressed','true');$('#closeTxt').textContent='마감취소';syncLock();redraw();toast('마감되었습니다');\n  });\n  const ht=$('#htModal');if(ht&&$('#htBtn')){$('#htBtn').addEventListener('click',()=>{ht.hidden=false;$('#htClose').focus()});\n  $('#htClose').addEventListener('click',()=>{ht.hidden=true});ht.addEventListener('click',e=>{if(e.target===ht)ht.hidden=true});\n  $('#htGo').addEventListener('click',()=>{ht.hidden=true;toast('선택한 자료를 조회합니다')})}\n  document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.scrim').forEach(m=>m.hidden=true)});\n  document.addEventListener('focusin',e=>{if(e.target.matches('input.cell'))setTimeout(()=>e.target.select(),0)});\n  let th='dark';try{th=localStorage.getItem('selfbooks-theme')||'dark'}catch(e){}\n  document.documentElement.setAttribute('data-theme',th);\n  $('#themeBtn').addEventListener('click',()=>{th=th==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',th);try{localStorage.setItem('selfbooks-theme',th)}catch(e){}});\n  applyPeriod();syncLock();redraw();\n}\n\nconst UNIT=200,LIMIT=1000000,CAP=300000000;\nconst PROG=[12,15,9,14,18,11,0,0,0,0,0,0];\nconst EXT=[0,0,3,0,0,0,0,0,0,0,0,0];\nlet PREV=0;\nconst PREV_PL=185420000;\nconst n  const add=[{id:'750303-1******',nm:'박지훈',d:'2026-05-12',t:880000},{id:'',nm:'',d:'2026-06-09',t:440000}];\n  ROWS=ROWS.concat(add);ORG.cash=ROWS.length;redraw();toast('매입매출전표에서 현금매출(현금영수증 미발행 포함) 자료를 불러왔습니다')});\nwindow.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='vat-set-closed'){closed=!!d.closed;syncLock();redraw()}});\nbindCommon(redraw,null);\n\n<\/script>\n"};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const frame=$('#frame');
function theme(){return document.documentElement.getAttribute('data-theme')||'dark'}
function syncFrame(){try{frame.contentDocument.documentElement.setAttribute('data-theme',theme())}catch(e){}}
let CUR=null,VCLOSED=false;
function sendClosed(){if(CUR==='gen'||CUR==='ije'||CUR==='ijec'||CUR==='rent'||CUR==='ele'||CUR==='cash'){try{frame.contentWindow.postMessage({type:'vat-set-closed',closed:VCLOSED},'*')}catch(e){}}}
frame.addEventListener('load',()=>{syncFrame();sendClosed()});
window.addEventListener('message',e=>{const d=e.data;if(d&&d.type==='vat-closed'&&d.screen==='gen'){VCLOSED=!!d.closed}});
function show(id,name){CUR=id;
  $$('.mi').forEach(b=>b.removeAttribute('aria-current'));
  const sel=id?$('.mi[data-id="'+id+'"]'):$('.mi[data-soon="'+name+'"]');
  if(sel)sel.setAttribute('aria-current','true');
  if(id){$('#soon').hidden=true;frame.hidden=false;frame.srcdoc=SCREENS[id]}
  else{frame.hidden=true;$('#soon').hidden=false;$('#soonName').textContent=name;$('#dbody').innerHTML='<p style="color:var(--muted)">준비중인 화면입니다.</p>'}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.mi');if(!b)return;
  if(b.dataset.id)show(b.dataset.id);else show(null,b.dataset.soon);
});
let t='dark';try{t=localStorage.getItem('selfbooks-theme')||'dark'}catch(e){}
document.documentElement.setAttribute('data-theme',t);
$('#themeBtn').addEventListener('click',()=>{
  const n=theme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem('selfbooks-theme',n)}catch(e){}
  syncFrame();
