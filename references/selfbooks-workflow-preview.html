<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounting Pro · 업무 화면 시안</title>
<style>
:root{font:14px/1.5 Inter,"Malgun Gothic",sans-serif;color:#14263b;background:#f3f6fa;--line:#dce4ee;--muted:#52677d;--blue:#1855cc;--soft:#edf4ff}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,a,summary{cursor:pointer}button,input,select,textarea{border:1px solid var(--line);border-radius:6px;background:white;padding:7px 10px}button:hover{border-color:#8ca7d2}button:disabled{opacity:.5;cursor:default}a{color:var(--blue)}:focus-visible{outline:2px solid #3475eb;outline-offset:2px}[hidden]{display:none!important}
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}aside{background:#11243a;color:#d8e5f2;padding:22px 14px}aside button{background:none;border:0;color:inherit;text-align:left;width:100%;padding:9px 11px}aside button:hover,aside [aria-current=page]{background:#24466a;color:white}aside summary{padding:9px 11px;font-weight:700}aside details button{padding-left:23px}.brand{display:flex;align-items:center;gap:10px;color:white;font-weight:750;font-size:19px;margin:0 8px 29px}.logo{display:grid;place-items:center;width:33px;height:33px;background:#3878e5;border-radius:9px;font-size:18px}.menu-label{margin:0 11px 8px;color:#a8bdd4;font-size:11px;letter-spacing:.12em}.context{min-height:60px;background:white;border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.context small{margin-left:auto;color:var(--muted)}main{padding:24px 26px}.breadcrumb{color:var(--muted);margin:0 0 6px;font-size:12px}h1{font-size:28px;margin:0 0 17px;letter-spacing:-.045em}h2{font-size:16px;margin:0}h3{font-size:13px;margin:0 0 8px}.card{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.tabs,.toolbar,.filters,.card-head,.totals{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}.tabs{padding-bottom:0}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:9px 12px 11px}.tabs [aria-pressed=true]{color:var(--blue);border-color:var(--blue);font-weight:700}.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}.push{margin-left:auto}.filters label,.context label{display:flex;gap:8px;align-items:center;color:var(--muted)}.filters input,.filters select{padding:5px 8px}.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(215px,23%);gap:14px;margin-top:14px}.work.wide{grid-template-columns:minmax(0,1fr)}.scroll{overflow:auto;min-height:380px;background:repeating-linear-gradient(white 0 43px,#edf1f6 43px 44px)}table{border-collapse:collapse;width:100%;background:white;min-width:650px;white-space:nowrap}th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);height:44px}th{background:#f1f5fa;font-size:12px;color:#40576f}tr.selected{background:var(--soft)}td input,td select,td button{width:100%;min-width:75px;padding:4px 6px;background:transparent}td input:not(:focus),td select:not(:focus){border-color:transparent}td .num{text-align:right;font-variant-numeric:tabular-nums;width:86px}.totals{background:#f8faff;border-bottom:0;border-top:1px solid var(--line);justify-content:space-between;font-variant-numeric:tabular-nums}.detail section{padding:14px;border-bottom:1px solid var(--line)}.detail section:last-child{border:0}.detail input,.detail textarea{width:100%}.muted{color:var(--muted)}.notice{color:#164db4;background:#eef4ff;padding:8px;border-radius:5px}.form{padding:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:6px}.body{padding:18px}.body ol{padding-left:23px}.body li{margin:10px 0}.body li button{margin-left:10px}.status{min-height:24px;margin:10px 0 0;color:#174785}dialog{border:1px solid var(--line);border-radius:12px;width:min(440px,92vw);padding:20px}dialog::backdrop{background:#0d213b88}dialog form{display:grid;gap:12px}dialog footer{display:flex;gap:8px;justify-content:flex-end}#choices{display:grid;gap:6px;max-height:160px;overflow:auto}
@media(max-width:1040px){.app{grid-template-columns:174px minmax(0,1fr)}main,.context{padding-left:16px;padding-right:16px}.work{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.app{display:block}aside{padding:12px}.brand{margin-bottom:8px}aside nav{display:flex;gap:5px;flex-wrap:wrap;align-items:flex-start}aside nav>button{width:auto}.menu-label{display:none}.context small{margin-left:0}.form{grid-template-columns:1fr}.toolbar .push{margin-left:0}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><span class="logo" aria-hidden="true">S</span> Accounting Pro</div>
  <p class="menu-label">MAIN MENU</p>
  <nav aria-label="업무 메뉴">
    <button data-page="대시보드">대시보드</button>
    <details id="basics"><summary>기초정보관리</summary>
      <button data-page="회사등록">회사등록</button><button data-page="환경등록">환경등록</button>
      <button data-page="계정과목 및 적요관리">계정과목 및 적요관리</button>
      <button data-page="거래처등록">거래처등록</button><button data-page="기초잔액관리">기초잔액관리</button>
    </details>
    <details open><summary>전표관리</summary>
      <button data-page="일반전표입력">일반전표입력</button><button data-page="매입매출전표입력">매입매출전표입력</button><button data-page="전표조회 및 검증">전표조회 및 검증</button>
    </details>
    <button data-page="자료수집">자료수집</button><button data-page="부가가치세">부가가치세</button>
    <button data-page="결산관리">결산관리</button><button data-page="장부 및 재무제표">장부 및 재무제표</button>
  </nav>
</aside>
<div>
  <header class="context"><strong>해솔문구 본점</strong><span class="muted">2026 회계연도</span><small>화면 시안 · 샘플 데이터</small></header>
  <main id="main"></main>
</div>
</div>
<dialog id="picker" aria-labelledby="picker-title">
  <form id="picker-form">
    <h2 id="picker-title"></h2>
    <label class="field">검색 또는 신규 항목명<input id="query" required maxlength="50" autocomplete="off"></label>
    <div id="choices"></div>
    <footer><button type="button" id="cancel-picker">취소</button><button class="primary" id="register">등록</button></footer>
  </form>
</dialog>
<script>
const main = document.querySelector('#main');
const picker = document.querySelector('#picker');
const query = document.querySelector('#query');
const choices = document.querySelector('#choices');
const general = '일반전표입력';
const sales = '매입매출전표입력';
const masters = '계정과목 및 적요관리';
const tabsByPage = {
  회사등록: {
    기본정보: ['회사명','사업자등록번호','주소','업태','종목'],
    대표자정보: ['대표자','공동대표자','연락처'],
    사업장정보: ['본점','지점','추가사업장'],
    세무정보: ['과세유형','관할세무서','담당자','환급계좌'],
    '첨부/메모': ['사업자등록증','계약서','업무메모'],
  },
  환경등록: {
    기본설정: ['업태·종목 표시','직원 채용 여부'],
    부가세설정: ['의제매입세액공제','간주임대료','간주공급'],
    '경비/차량': ['식대 불공제','차량 보유현황','승용차 불공제'],
    '거래처/품목': ['주요 거래처','품목 매핑'],
    자동화규칙: ['매출 적요','매입 적요','거래 인식 규칙','분류 규칙'],
  },
  [masters]: {계정과목관리: [], 거래적요관리: [], 연결관계: ['관계계정','자동분개 매핑']},
};
const accounts = [
  {name:'보통예금', code:'', nature:'자산', group:'유동자산', attribute:''},
  {name:'소모품비', code:'', nature:'비용', group:'판매비와관리비', attribute:''},
  {name:'통신비', code:'', nature:'비용', group:'판매비와관리비', attribute:''},
];
const descriptions = [{name:'사무용품 구입', code:'', account:'소모품비'}, {name:'인터넷 이용료', code:'', account:'통신비'}];
const date = '2026-11-03';
const rows = {
  [general]: [
    {date, account:'소모품비', description:'사무용품 구입', debit:'85000', credit:'', partner:'한빛오피스'},
    {date, account:'보통예금', description:'사무용품 구입', debit:'', credit:'85000', partner:'한빛오피스'},
    {date:'2026-11-06', account:'통신비', description:'인터넷 이용료', debit:'45000', credit:'', partner:'다온통신'},
    {date:'2026-11-06', account:'보통예금', description:'인터넷 이용료', debit:'', credit:'45000', partner:'다온통신'},
  ],
  [sales]: [
    {date, type:'51', item:'사무용품', supply:'85000', vat:'8500', partner:'한빛오피스', evidence:'전자세금계산서'},
    {date:'2026-11-05', type:'11', item:'문구 세트', supply:'420000', vat:'42000', partner:'새봄상사', evidence:'전자세금계산서'},
    {date:'2026-11-09', type:'51', item:'포장 자재', supply:'65000', vat:'0', partner:'푸른패키지'},
  ],
};
const columns = {
  [general]: [['date','일자'],['account','계정과목'],['description','적요'],['debit','차변'],['credit','대변']],
  [sales]: [['date','일자'],['type','거래유형'],['partner','거래처'],['item','품목'],['supply','공급가액'],['vat','부가세']],
};
const moneyFields = ['debit','credit','supply','vat'];
const filters = Object.fromEntries(Object.keys(rows).map(key => [key,{from:'2026-11-01',to:'2026-11-30',direction:'',type:''}]));
const formValues = {};
const setup = ['회사등록','환경등록',masters,'거래처등록','기초잔액관리'];
const completed = new Set();
let page = general;
let tab = '';
let selected = rows[general][0];
let collapsed = false;
let registration;
const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const amount = value => BigInt(value || '0');
const format = value => amount(value).toLocaleString('ko-KR');
const sum = (items,key) => items.reduce((total,row) => total + amount(row[key]),0n);
const warning = row => ['11','51'].includes(row.type) && amount(row.vat) === 0n;
const typeOptions = value => [['','선택'],['11','11 매출 과세'],['51','51 매입 과세']].map(([code,label]) =>
  '<option value="'+code+'" '+(value===code?'selected':'')+'>'+label+'</option>').join('');

function navigate(next) {
  page = next;
  tab = Object.keys(tabsByPage[page] || {})[0] || '';
  selected = rows[page]?.[0];
  if (setup.includes(page)) document.querySelector('#basics').open = true;
  render();
}

function tabBar(items, active, action) {
  return '<div class="tabs">'+items.map(item => '<button '+action+'="'+escape(item)+'" aria-pressed="'+(item===active)+'">'+escape(item)+'</button>').join('')+'</div>';
}

function visibleRows() {
  const filter = filters[page];
  return rows[page].filter(row => row.date >= filter.from && row.date <= filter.to &&
    (!filter.type || row.type === filter.type) && (!filter.direction || row.type === filter.direction));
}

function cell(row,key,label) {
  const value = row[key] || '';
  if (key === 'account' || key === 'description') {
    return '<button data-pick="'+key+'" aria-label="'+label+' 선택">'+escape(value || label+' 선택')+'</button>';
  }
  if (key === 'type') return '<select data-key="type" aria-label="'+label+'">'+typeOptions(value)+'</select>';
  return '<input data-key="'+key+'" aria-label="'+label+'" value="'+escape(value)+'" '+
    (key==='date'?'type="date" min="2026-01-01" max="2026-12-31"':moneyFields.includes(key)?'class="num" inputmode="numeric" maxlength="15"':'')+'>';
}

function details() {
  if (!selected) return '<section class="muted">상세정보를 볼 행을 선택하세요.</section>';
  const check = page===sales
    ? warning(selected)?'<p class="notice">확인요망 · 과세 유형의 부가세가 0원입니다.</p>':'<span class="muted">0원 세액 확인 대상 없음</span>'
    : sum(rows[page],'debit')===sum(rows[page],'credit')?'차변과 대변 합계 일치':'차변과 대변 합계 불일치';
  return '<section><h3>거래처정보</h3><input data-detail="partner" aria-label="거래처" placeholder="거래처 입력" value="'+escape(selected.partner)+'"></section>'+
    '<section><h3>증빙 및 원본 자료</h3>'+(selected.evidence?'<details><summary>증빙 조회</summary><p class="muted">'+escape(selected.evidence)+' · 샘플</p></details>':'<span class="muted">연결된 증빙 없음</span>')+'</section>'+
    '<section><h3>자동분류 및 검증</h3>'+check+'</section>'+
    '<section><h3>적요 및 메모</h3><button data-pick="description">'+escape(selected.description || '적요 선택')+'</button><p><textarea data-detail="memo" aria-label="업무 메모" placeholder="업무 메모">'+escape(selected.memo)+'</textarea></p></section>';
}

function voucher() {
  const filter = filters[page];
  const visible = visibleRows();
  if (!visible.includes(selected)) selected = visible[0];
  const totals = (page===general?[['debit','차변'],['credit','대변']]:[['supply','공급가액'],['vat','부가세']])
    .map(([key,label]) => '<span>'+label+' <strong>'+format(sum(visible,key))+'원</strong></span>').join('');
  return '<section class="card">'+tabBar([general,sales],page,'data-page')+
    '<form class="filters" id="filters"><label>조회기간 <input type="date" name="from" aria-label="조회 시작일" required min="2026-01-01" max="2026-12-31" value="'+filter.from+'"></label><span>~</span>'+
    '<input type="date" name="to" aria-label="조회 종료일" required min="2026-01-01" max="2026-12-31" value="'+filter.to+'">'+
    (page===sales?'<label>구분 <select name="direction"><option value="">전체</option><option value="51" '+(filter.direction==='51'?'selected':'')+'>매입</option><option value="11" '+(filter.direction==='11'?'selected':'')+'>매출</option></select></label><label>거래유형 <select name="type">'+typeOptions(filter.type)+'</select></label>':'')+
    '<button>조회</button></form>'+
    '<div class="toolbar"><button data-action="add">＋ 추가</button><button data-action="copy" '+(!selected?'disabled':'')+'>복사</button><button data-action="delete" '+(!selected?'disabled':'')+'>삭제</button><button data-action="panel" class="push">'+(collapsed?'상세 패널 열기':'상세 패널 접기')+'</button><button data-action="save" class="primary">저장</button></div></section>'+
    '<div class="work '+(collapsed?'wide':'')+'"><section class="card" aria-label="전표 입력 표"><div class="scroll"><table><thead><tr><th scope="col">행</th>'+
    columns[page].map(([,label])=>'<th scope="col">'+label+'</th>').join('')+'</tr></thead><tbody>'+
    (visible.length?visible.map((row,i)=>'<tr data-row="'+rows[page].indexOf(row)+'" class="'+(row===selected?'selected':'')+'"><td><button data-action="select" aria-label="'+(i+1)+'행 상세 보기" aria-pressed="'+(row===selected)+'" style="min-width:32px">'+(i+1)+'</button></td>'+
      columns[page].map(([key,label])=>'<td>'+cell(row,key,label)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+(columns[page].length+1)+'">조회된 전표가 없습니다.</td></tr>')+
    '</tbody></table></div><div class="totals"><span>'+visible.length+'행</span>'+totals+'</div></section>'+
    (collapsed?'':'<section class="card detail"><div class="card-head"><h2>전표 상세정보</h2></div><div id="detail-content">'+details()+'</div></section>')+'</div>';
}

function masterTable(keyword='') {
  const isAccount = tab==='계정과목관리';
  const fields = isAccount?{code:'코드',name:'계정명',nature:'성격',group:'분류',attribute:'세부속성'}:{code:'적요코드',name:'적요명',account:'연결 계정과목'};
  const entries = (isAccount?accounts:descriptions).filter(item => (item.name+' '+item.code).includes(keyword));
  return '<table><thead><tr>'+Object.values(fields).map(label=>'<th scope="col">'+label+'</th>').join('')+'</tr></thead><tbody>'+
    (entries.length?entries.map(item=>'<tr>'+Object.keys(fields).map(key=>'<td>'+escape(item[key] || '—')+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+Object.keys(fields).length+'">검색 결과가 없습니다.</td></tr>')+'</tbody></table>';
}

function settings() {
  const fields = tabsByPage[page][tab];
  const search = page===masters && tab!=='연결관계';
  return '<section class="card">'+(page==='회사등록'?'<div class="filters"><label>수임처 선택 <select><option>해솔문구 본점</option></select></label></div>':'')+
    tabBar(Object.keys(tabsByPage[page]),tab,'data-tab')+
    (search?'<div class="filters"><label>검색 <input id="master-search" placeholder="코드 또는 이름"></label><button data-pick="'+(tab==='계정과목관리'?'account':'description')+'">＋ 등록</button></div><div class="scroll" id="master-results">'+masterTable()+'</div>':
    '<div class="form">'+fields.map(label=>{
      const key = page+'|'+tab+'|'+label;
      const value = formValues[key] ?? (label==='회사명'?'해솔문구':'');
      return '<label class="field">'+label+(label==='사업자등록증'||label==='계약서'?'<input type="file" aria-label="'+label+'">':'<input data-setting="'+escape(key)+'" value="'+escape(value)+'">')+'</label>';
    }).join('')+'</div>')+'</section>';
}

function dashboard() {
  return '<section class="card body"><h2>최초 환경설정</h2><p class="muted">신규 수임처 준비 · '+completed.size+' / '+setup.length+'단계 완료</p><ol>'+
    setup.map((item,index)=>'<li><label><input type="checkbox" data-step="'+index+'" '+(completed.has(item)?'checked':'')+'> '+item+' 완료</label><button data-page="'+item+'">열기</button></li>').join('')+
    '</ol><div class="toolbar"><button class="primary" data-page="'+general+'">일반전표 입력</button><button data-page="'+sales+'">매입매출전표 입력</button></div></section>';
}

function otherPage() {
  if (page==='부가가치세') return '<section class="card body"><a href="./부가가치세화면모음.html" target="_blank" rel="noopener">기존 부가가치세 화면모음 열기 ↗</a></section>';
  return '<section class="card body muted">이 메뉴는 업무 화면 배치를 확인하기 위한 항목입니다.</section>';
}

function render(message='') {
  document.querySelectorAll('nav [data-page]').forEach(button => {
    if (button.dataset.page===page) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
  const category = setup.includes(page)?'기초정보관리':rows[page] || page==='전표조회 및 검증'?'전표관리':'업무 공간';
  main.innerHTML = '<p class="breadcrumb">'+category+'</p><h1>'+page+'</h1>'+
    (rows[page]?voucher():tabsByPage[page]?settings():page==='대시보드'?dashboard():otherPage())+
    '<p class="status" id="status" role="status">'+escape(message)+'</p>';
}

function openPicker(field) {
  registration = {field, row:rows[page]?selected:undefined};
  if (rows[page] && !registration.row) return;
  document.querySelector('#picker-title').textContent = field==='account'?'계정과목 검색 및 등록':'적요 검색 및 등록';
  query.value = '';
  updateChoices();
  picker.showModal();
  query.focus();
}

function available() {
  return registration.field==='account'?accounts:descriptions;
}

function updateChoices() {
  const keyword = query.value.trim();
  choices.innerHTML = available().filter(item=>item.name.includes(keyword)).map(item=>'<button type="button" data-choice="'+escape(item.name)+'">'+escape(item.name)+'</button>').join('') || '<span class="muted">일치하는 항목이 없습니다.</span>';
  document.querySelector('#register').disabled = !keyword || available().some(item=>item.name===keyword);
}

function finishPicker(name, message) {
  const row = registration.row;
  const field = registration.field;
  if (row) row[field] = name;
  picker.close();
  render(message);
  if (row) main.querySelector('tr.selected [data-pick="'+field+'"]')?.focus();
}

function action(name) {
  const filter = filters[page];
  if (name==='panel') collapsed = !collapsed;
  if (name==='add' || name==='copy') {
    const type = filter.type || filter.direction;
    if (filter.type && filter.direction && filter.type!==filter.direction) {
      render('구분과 거래유형을 같은 범위로 선택하세요.');
      return;
    }
    selected = name==='copy'?{...selected}:{date:filter.from,type};
    rows[page].push(selected);
  }
  if (name==='delete' && selected && confirm('선택한 행을 삭제할까요?')) {
    rows[page].splice(rows[page].indexOf(selected),1);
    selected = undefined;
  }
  if (name==='save') {
    const items = rows[page];
    if (!items.length) return render('저장할 행을 추가하세요.');
    if (items.some(row=>!row.date || row.date<'2026-01-01' || row.date>'2026-12-31')) return render('2026 회계연도 안의 일자를 입력하세요.');
    if (page===general && (sum(items,'debit')!==sum(items,'credit') || items.some(row=>!row.account || Boolean(amount(row.debit))===Boolean(amount(row.credit))))) {
      return render('각 행의 계정과목과 차변 또는 대변 금액을 입력하고 합계를 맞춰 주세요.');
    }
    if (page===sales && items.some(row=>!row.type || !row.partner || !row.item || !row.supply || !row.vat)) return render('거래유형, 거래처, 품목, 공급가액, 부가세를 입력하세요.');
    if (page===sales && items.some(warning) && !confirm('부가세가 0원인 과세 전표가 있습니다. 확인 후 시안에 저장할까요?')) return;
    return render('시안에서 저장을 확인했습니다. 새로고침하면 샘플로 돌아갑니다.');
  }
  render();
}

document.addEventListener('click',event=>{
  const button = event.target.closest('button');
  if (!button) return;
  const {page:next,tab:nextTab,pick,action:name,choice} = button.dataset;
  if (next) return navigate(next);
  if (nextTab) {tab = nextTab; return render();}
  const row = button.closest('[data-row]');
  if (row) selected = rows[page][row.dataset.row];
  if (pick) return openPicker(pick);
  if (name) return action(name);
  if (choice) finishPicker(choice,'선택한 항목을 적용했습니다.');
});

main.addEventListener('submit',event=>{
  event.preventDefault();
  const values = Object.fromEntries(new FormData(event.target));
  if (values.from > values.to) {
    document.querySelector('#status').textContent = '조회 시작일은 종료일보다 늦을 수 없습니다.';
    return;
  }
  filters[page] = {...filters[page],...values};
  render();
});

main.addEventListener('input',event=>{
  const input = event.target;
  if (input.id==='master-search') document.querySelector('#master-results').innerHTML = masterTable(input.value.trim());
  if (input.dataset.setting) formValues[input.dataset.setting] = input.value;
  if (input.dataset.detail && selected) selected[input.dataset.detail] = input.value;
  if (input.dataset.key) {
    const key = input.dataset.key;
    if (moneyFields.includes(key)) input.value = input.value.replace(/[^0-9]/g,'').slice(0,15);
    rows[page][input.closest('[data-row]').dataset.row][key] = input.value;
    if (moneyFields.includes(key)) {
      const keys = page===general?['debit','credit']:['supply','vat'];
      const totals = main.querySelectorAll('.totals strong');
      keys.forEach((field,index) => {totals[index].textContent = format(sum(visibleRows(),field))+'원';});
      const detail = document.querySelector('#detail-content');
      if (detail) detail.innerHTML = details();
    }
  }
});

main.addEventListener('change',event=>{
  if (event.target.dataset.step !== undefined) {
    const item = setup[event.target.dataset.step];
    if (event.target.checked) completed.add(item);
    else completed.delete(item);
    render();
  }
  if (['date','type'].includes(event.target.dataset.key)) render();
});

query.addEventListener('input',updateChoices);
document.querySelector('#cancel-picker').onclick = () => {picker.close(); render();};
document.querySelector('#picker-form').onsubmit = event => {
  event.preventDefault();
  const name = query.value.trim();
  if (!name || available().some(item=>item.name===name)) return;
  available().push({name, code:''});
  finishPicker(name,registration.row?'신규 항목을 등록하고 전표에 적용했습니다.':'신규 항목을 등록했습니다.');
};
render();
</script>
</body>
</html>
