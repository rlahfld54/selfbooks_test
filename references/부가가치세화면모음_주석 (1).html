 행 수가 많으면 표 안에서 스크롤된다. 행을 체크한 뒤 [삭제]하면 체크한 행이 모두 삭제된다(체크가 없으면 선택된 행 삭제). 원 단위 처리 기준은 확인필요."}, {"s": "#addRow", "t": "+ 행 추가", "d": "새 행의 거래일자 기본값은 조회 종료월 28일. 마감 후 비활성."}, {"s": "#saveBtn", "t": "저장 / 마감 연동", "d": "이 화면에는 마감 버튼이 없고 부가가치세 신고서의 마감 상태와 연동된다. 기수 선택은 두지 않고 기간만 표시한다."}]};
const NAMES={gen:'일반과세 신고서',sim:'간이과세 신고서',inv:'세금계산서합계표',bill:'계산서합계표',crv:'신용카드매출전표등수령명세서',cis:'신용카드매출전표등발행금액집계표',ije:'의제매입세액공제신고서 (개인)',ijec:'의제매입세액공제신고서 (법인)',rent:'부동산임대공급가액명세서',ele:'전자세금계산서발급세액공제신고서',cash:'현금매출명세서'};
const TARGETS=[];
function findEl(doc,a){
  if(a.s){const e=doc.querySelector(a.s);return e}
  const q=doc.querySelectorAll('h2,h3,legend,th,label,b,strong,.sec2,.ttl');
  for(const e of q){if(e.textContent.replace(/\s+/g,' ').includes(a.x))return e}
  return null}
function pulse(el){const d=el.ownerDocument;el.classList.remove('an-pulse');void el.offsetWidth;el.classList.add('an-pulse');setTimeout(()=>el.classList.remove('an-pulse'),2200)}
function setOn(i){$$('.an').forEach((b,k)=>b.classList.toggle('on',k===i));const b=$$('.an')[i];if(b)b.scrollIntoView({block:'nearest'})}
function goto(i){const el=TARGETS[i];if(!el)return;setOn(i);
  const bd=el.closest('.modal,[id$="Modal"]');
  el.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'});pulse(el)}
function buildDock(id){
  const list=ANN[id]||[];$('#dTitleH').textContent='개발자 주석 · '+(NAMES[id]||'');
  $('#dbody').innerHTML=list.map((a,i)=>'<button type="button" class="an" data-i="'+i+'"><span class="n">'+(i+1)+'</span><b>'+a.t+'</b><p>'+a.d+'</p></button>').join('')||'<p style="color:var(--muted)">이 화면은 주석이 없습니다.</p>'}
function applyAnn(){
  const id=CUR;TARGETS.length=0;if(!id)return;buildDock(id);
  let doc;try{doc=frame.contentDocument}catch(e){return}
  if(!doc||!doc.body)return;
  if(!doc.getElementById('annCss')){const s=doc.createElement('style');s.id='annCss';
    s.textContent='.an-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:#D9A441;color:#1B1404;font:700 11px/1 "JetBrains Mono",monospace;cursor:pointer;z-index:40;box-shadow:0 0 0 2px rgba(0,0,0,.25);margin-left:5px;vertical-align:middle;text-transform:none;letter-spacing:0;white-space:nowrap}.an-badge.abs{position:absolute;top:-8px;right:-8px;margin:0}.an-badge:hover{transform:scale(1.15)}@keyframes anp{0%,100%{box-shadow:0 0 0 0 rgba(217,164,65,0)}30%{box-shadow:0 0 0 4px rgba(217,164,65,.9)}}.an-pulse{animation:anp .55s ease-in-out 3;outline:2px solid #D9A441!important;outline-offset:2px}';
    doc.head.appendChild(s)}
  doc.querySelectorAll('.an-badge').forEach(x=>x.remove());
  (ANN[id]||[]).forEach((a,i)=>{
    let el=findEl(doc,a);if(!el){TARGETS[i]=null;const b=$$('.an')[i];if(b)b.classList.add('miss');return}
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)&&el.parentElement)el=el.parentElement;
    TARGETS[i]=el;
    const bd=doc.createElement('span');bd.className='an-badge';bd.textContent=i+1;bd.title=a.t;
    const inl=/^(H1|H2|H3|TH|LABEL|B|STRONG|LEGEND|SPAN|P|DIV)$/.test(el.tagName)&&!/^(TABLE|TBODY)$/.test(el.tagName);
    const isCtl=/^(BUTTON)$/.test(el.tagName)||/(^|\s)(card|tbl|wrap)(\s|$)/.test(el.className)||/^(TABLE|TBODY|DIV)$/.test(el.tagName)||el.id==='ftable';
    if(el.tagName==='TBODY'||el.tagName==='TABLE'){const w=el.closest('table')||el;const p=w.parentElement;if(getComputedStyle(p).position==='static')p.style.position='relative';bd.classList.add('abs');bd.style.right='auto';bd.style.left='6px';p.appendChild(bd);TARGETS[i]=w}
    else if(/^H[123]$|^TH$|^LEGEND$|^LABEL$|^B$|^STRONG$/.test(el.tagName)){el.appendChild(bd)}
    else{if(getComputedStyle(el).position==='static')el.style.position='relative';bd.classList.add('abs');if(el.tagName!=='BUTTON'){bd.style.right='6px';bd.style.top='-9px'}el.appendChild(bd)}
    bd.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();goto(i)})
  });
  $$('.an').forEach(b=>b.addEventListener('click',()=>goto(+b.dataset.i)));
  const wrapped=$$('.an');
}
frame.addEventListener('load',()=>{setTimeout(applyAnn,60)});
$('#bizType').addEventListener('change',()=>{const corp=$('#bizType').value==='법인';
  const m=$('.mi[data-id="ele"]');if(m)m.hidden=corp;
  if(corp&&CUR==='ele')show('gen')});
$('#dToggle').addEventListener('click',()=>{const c=$('#dock').classList.toggle('col');$('#dToggle').textContent=c?'◂':'▸'});

show('gen');
</script>
